<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>העברת הקריירה · Goal-m</title><style>body{background:#081923;color:#fff;font:18px system-ui;max-width:620px;margin:40px auto;padding:20px;line-height:1.7}button,a,input{font:inherit}button,a{display:block;padding:14px;margin:16px 0;background:#64e4cc;color:#081923;border:0;border-radius:12px;text-decoration:none}input{max-width:100%}#status{white-space:pre-wrap}</style><h1>העברת הקריירה במתחילים</h1><p>השמירה נשארת בדפדפן שבו שיחקת. אפשר לשמור עותק בקובץ ולהעביר אותו לכתובת החדשה.</p><button id="export">הורד עותק של הקריירה בדפדפן הזה</button><p>לשחזור בכתובת החדשה, בחר את קובץ הקריירה שהורדת:</p><input id="file" type="file" accept=".json,application/json"><p id="preview"></p><button id="import" disabled>ייבא את הקריירה</button><p id="status" role="status"></p><a href="beginner.html">למשחק המתחילים</a><script>
const key='goalasso.beginner.v1',status=document.getElementById('status');let candidate=null;
function validate(raw){const d=JSON.parse(raw),g=d?.G;if(d.version!==1||!g?.beginner||!Array.isArray(g.clubs)||!g.clubs.some(c=>c.id===g.me&&Array.isArray(c.players))||!Number.isFinite(d.uid))throw Error('הקובץ אינו שמירת מתחילים תקינה.');return d}
function download(raw){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.href=u;a.download='goal-m-career.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.getElementById('export').onclick=()=>{try{let raw=localStorage.getItem(key);try{validate(raw)}catch(e){raw=localStorage.getItem(key+'.backup');validate(raw)}download(raw);status.textContent='העותק הורד. השמירה המקורית לא השתנתה.'}catch(e){status.textContent='לא נמצאה כאן שמירת מתחילים תקינה. פתח דף זה בדפדפן ובכתובת שבהם שיחקת.'}};
document.getElementById('file').onchange=async e=>{candidate=null;document.getElementById('import').disabled=true;try{const f=e.target.files[0];if(!f)return;if(f.size>20*1024*1024)throw Error('הקובץ גדול מדי.');const raw=await f.text(),d=validate(raw),c=d.G.clubs.find(c=>c.id===d.G.me);candidate=raw;document.getElementById('preview').textContent=c.name+' · '+(c.pts||0)+' נקודות · '+(c.P||0)+' משחקים';document.getElementById('import').disabled=false}catch(e){status.textContent=e.message}};
document.getElementById('import').onclick=()=>{try{if(!candidate)return;const old=localStorage.getItem(key);if(old&&!confirm('כבר קיימת קריירה בכתובת הזו. להחליף אותה בקובץ שנבחר? עותק קודם יישמר כגיבוי.'))return;validate(candidate);if(old)localStorage.setItem(key+'.backup',old);localStorage.setItem(key,candidate);status.textContent='הקריירה יובאה. אפשר לחזור למשחק.';document.getElementById('import').disabled=true}catch(e){status.textContent='הייבוא נכשל: '+e.message}};
</script></html>
