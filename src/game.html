const CHUNK=140000;
async function gzipB64(str){const bytes=new TextEncoder().encode(str);let out;if(typeof CompressionStream!=='undefined'){const cs=new CompressionStream('gzip');const w=cs.writable.getWriter();w.write(bytes);w.close();out=new Uint8Array(await new Response(cs.readable).arrayBuffer())}else out=bytes;let bin='';for(let i=0;i<out.length;i+=0x8000)bin+=String.fromCharCode.apply(null,out.subarray(i,i+0x8000));return {b64:btoa(bin),gz:typeof CompressionStream!=='undefined'}}
async function unB64(b64,gz){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!gz)return new TextDecoder().decode(bytes);const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();w.write(bytes);w.close();return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer())}
let cloud={db:null,user:null,uid:null,ready:false,busy:false,meta:null,err:null};
function cloudPath(n){return n===1?`data/users/${cloud.uid}/save`:`data/users/${cloud.uid}/save_s${n}`}
async function cloudRefreshMeta(){if(!cloud.db||!cloud.uid)return;try{const snap=await cloud.db.doc(cloudPath(curSlot())).get();cloud.meta=snap.exists?snap.data():null}catch(e){cloud.meta=null}checkCloudConflict()}
function checkCloudConflict(){const m=cloud.meta;if(!G||!m||$('modal'))return;const local=G.savedAt||0;if(m.t>local+60000&&(m.wk!==G.wk||m.season!==seasonLabel())){openModal(`<h3 class="sec">יש שמירה חדשה יותר בענן</h3><p class="small">בענן: ${esc(m.club||'')} · ${esc(m.season||'')} · שבוע ${(m.wk||0)+1} · ${new Date(m.t).toLocaleString('he-IL')}<br>במכשיר הזה: ${esc(me()?me().name:'')} · ${seasonLabel()} · שבוע ${G.wk+1}${local?' · '+new Date(local).toLocaleString('he-IL'):''}</p><p class="muted tiny">כנראה שיחקת במכשיר אחר. בחר איזו גרסה להמשיך. הגרסה השנייה לא תימחק עד שתשמור עליה.</p><div class="actions"><button class="btn" id="conflictCloud">המשך מהענן</button><button class="btn sec" id="conflictLocal">השאר את המקומית</button></div>`,e=>{if(e.target.closest('#conflictCloud')){closeModal();cloudLoad()}if(e.target.closest('#conflictLocal')){closeModal();G.savedAt=Date.now();save();toast('ממשיכים מהגרסה המקומית. "שמור בענן" יעדכן גם את הענן.')}})}}

async function cloudSave(silent){if(!cloud.ready||!G||cloud.busy)return;cloud.busy=true;try{const json=JSON.stringify(G);const {b64,gz}=await gzipB64(json);const n=Math.ceil(b64.length/CHUNK);const base=cloud.db.doc(cloudPath(curSlot()));

let AC=null;function ac(){if(G&&G.sound===false)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,dur,type,gain,when){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+(when||0));g.gain.linearRampToValueAtTime(gain||.15,a.currentTime+(when||0)+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+(when||0)+dur);o.connect(g).connect(a.destination);o.start(a.currentTime+(when||0));o.stop(a.currentTime+(when||0)+dur+.05)}
function noise(dur,gain,when){const a=ac();if(!a)return;const buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=.6;const g=a.createGain();g.gain.value=gain||.25;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+(when||0))}
const SFX={whistle(){tone(2200,.25,'square',.08);tone(2200,.35,'square',.08,.3)},whistleEnd(){tone(2200,.2,'square',.08);tone(2200,.2,'square',.08,.25);tone(2200,.6,'square',.08,.5)},goal(mine){noise(1.6,mine?.35:.2);if(mine){tone(523,.15,'triangle',.12,.1);tone(659,.15,'triangle',.12,.25);tone(784,.3,'triangle',.14,.4)}},groan(){noise(.8,.15);tone(180,.5,'sawtooth',.05)},card(){tone(1200,.08,'square',.06);tone(900,.12,'square',.06,.1)},click(){tone(880,.05,'sine',.05)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.14,i*.15));noise(2.5,.3,.3)}};

/* ---- confetti ---- */
function confetti(ms){if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;let cv=$('confetti');if(!cv){cv=document.createElement('canvas');cv.id='confetti';cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:50';document.body.appendChild(cv)}
  const ctx=cv.getContext('2d');if(!ctx){cv.remove();return}cv.width=innerWidth;cv.height=innerHeight;const cols=['#27f0a6','#ffd34d','#ff4d8d','#5cb8ff','#fff'];const ps=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,s:4+Math.random()*5,c:pick(cols),r:Math.random()*6.28,vr:(Math.random()-.5)*.3}));
  const t0=performance.now();(function fr(t){ctx.clearRect(0,0,cv.width,cv.height);for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore()}if(t-t0<(ms||2500))requestAnimationFrame(fr);else{ctx.clearRect(0,0,cv.width,cv.height);cv.remove()}})(t0)}

/* ====================== WEEK FLOW ====================== */
function currentEvent(){return G.cal[G.wk]}
function cupNext(c,ev){if(G.cup.stage!==ev.s||!G.cup.alive.includes(G.me))return null;const d=G.cup.draw&&G.cup.draw.stage===ev.s?G.cup.draw.pairs.find(p=>p.includes(G.me)):null;if(d&&club(d[0])&&club(d[1]))return {kind:'cup',h:club(d[0]),a:club(d[1]),neutral:ev.s==='F',label:CUP_HE[ev.s]};return {kind:'cup',h:c,a:null,label:CUP_HE[ev.s]}}
function myNextMatch(){
  const ev=currentEvent();if(!ev)return null;const c=me();
  if(ev.t==='league'||(ev.t==='cup'&&!c.league&&G.lsched[G.wk])){if(!c.league){const lr=G.lsched[G.wk];const fx=lr?G.lfx[lr-1]:null;if(!fx)return ev.t==='cup'?null:null;const m=fx.find(([h,a])=>h===G.me||a===G.me);if(m)return {kind:'league',h:club(m[0]),a:club(m[1]),label:leumitRoundLabel(lr)+(lr>30?(c.group==='top'?' עליון':' תחתון'):'')};if(ev.t==='cup')return cupNext(c,ev);return null}
    const fx=G.fixtures[ev.n-1];if(!fx)return null;const m=fx.find(([h,a])=>h===G.me||a===G.me);return m?{kind:'league',h:club(m[0]),a:club(m[1]),label:`מחזור ${ev.n}${ev.n>26?(c.group==='top'?' · פלייאוף עליון':' · פלייאוף תחתון'):''}`}:null}
  if(ev.t==='cup')return cupNext(c,ev);
  if(ev.t==='euro'){const E=c.euro;if(E&&E.stage===ev.stage&&(ev.stage!=='LP'||ev.leg<=LP_MATCHES[E.comp])){const label=`${COMP_HE[E.comp]} · ${STAGE_HE[ev.stage]}${ev.stage==='LP'?` מחזור ${ev.leg}`:ev.leg?` משחק ${ev.leg}`:''}`;let opp=null,homeNow=true,neutral=false;
      if(ev.stage==='LP'){opp=E.lpOpps?club(E.lpOpps[ev.leg-1]):null;homeNow=ev.leg%2===1}else if(ev.stage==='F'){opp=E.tie?club(E.tie.opp):null;neutral=true}else if(E.tie&&!E.tie.final){opp=club(E.tie.opp);homeNow=ev.leg===1?E.tie.home1:!E.tie.home1}
      return opp?{kind:'euro',h:homeNow?c:opp,a:homeNow?opp:c,neutral,firstLeg:ev.leg===2&&E.tie&&E.tie.g1?E.tie.g1:null,label}:{kind:'euro',h:c,a:null,label}}
    if(['Q2','Q3','PO'].includes(ev.stage)){if(c.league&&G.toto&&!G.toto.winner){const tr=ev.stage==='Q2'?(ev.leg===1?1:2):ev.stage==='Q3'?(ev.leg===1?3:4):(ev.leg===1?'SF':'F');if(typeof tr==='number'){const lbl=`גביע הטוטו · בית ${totoGroupOf(c.id)} · מחזור ${tr}`;const sch=G.toto.sched&&G.toto.sched[tr];if(sch){if(G.toto.round>=tr)return null;const m=sch.find(p=>p.includes(c.id));return m?{kind:'toto',h:club(m[0]),a:club(m[1]),label:lbl}:null}return {kind:'toto',h:c,a:null,label:lbl}}if(tr==='SF'&&!G.toto.results.some(r=>r.r==='SF')){if(G.toto.semis){const m=G.toto.semis.find(p=>p.includes(c.id));return m?{kind:'toto',h:club(m[0]),a:club(m[1]),label:'גביע הטוטו · חצי הגמר'}:null}const a=totoStandings('A'),b=totoStandings('B');const inSF=[a[0],a[1],b[0],b[1]].some(x=>x&&x.id===c.id);return inSF?{kind:'toto',h:c,a:null,label:'גביע הטוטו · חצי הגמר'}:null}if(tr==='F'&&G.toto.finalists&&G.toto.finalists.includes(c.id)&&!G.toto.results.some(r=>r.r==='F')){const f=G.toto.finalists;return f.length>=2?{kind:'toto',h:club(f[0]),a:club(f[1]),neutral:true,label:'גביע הטוטו · הגמר'}:{kind:'toto',h:c,a:null,label:'גביע הטוטו · הגמר'}}return null}
      if(ev.leg===1){const fo=c.nextFriendly&&c.nextFriendly.wk===G.wk?club(c.nextFriendly.opp):null;return {kind:'friendly',h:c,a:fo||null,label:'משחק ידידות'}}}return null}
  return null;
}
function advanceWeek(){
  const ev=currentEvent();if(!ev)return null;
  ensureDraws();autoLineups();let my=null;
  if(ev.t==='league'){
    const fx=G.fixtures[ev.n-1];
    for(const [hid,aid] of fx){const h=club(hid),a=club(aid);const M=createMatch(h,a,{kind:'league',round:ev.n,label:`מחזור ${ev.n}`});if(hid===G.me||aid===G.me)my=M;else{runInstant(M);settle(M)}}
  }else if(ev.t==='cup')my=playCupWeek(ev.s);
  const lr=G.lsched&&G.lsched[G.wk];
  if(lr&&G.lfx[lr-1]){for(const [hid,aid] of G.lfx[lr-1]){const h=club(hid),a=club(aid);if(!h||!a)continue;const M=createMatch(h,a,{kind:'league',round:lr,leumit:true,label:leumitRoundLabel(lr)});if((hid===G.me||aid===G.me)&&!my)my=M;else{runInstant(M);settle(M)}}}
  else if(ev.t==='euro')my=playEuroWeek(ev);
  else if(ev.t==='break')intlBreak(ev);
  G.live=my||null;
  if(my)my.live=true;
  if(!my)finishWeek();
  return my;
}
function afterMyMatch(M){if(M.settled)return;M.settled=true;settle(M);G.live=null;try{localStorage.removeItem('ilm2_livefl')}catch(e){}finishWeek()}
function finishWeek(){
  const ev=currentEvent();
  if(ev.t==='cup')finishCupStage();
  if(ev.t==='league'&&ev.n===26)buildPlayoff();
  if(G.lsched&&G.lsched[G.wk]===30&&!G.lsplit)buildLeumitPlayoff();
  if(G.lsched&&G.lsched[G.wk]===37){const lst=standingsOf('leumit');G.lchampion=lst[0].id;news(`${lst[0].name} אלופת הליגה הלאומית!`)}

const SAVE_VERSION=7;const SLOTS=3;

const MIGRATIONS=[[5,'נתוני משחק מפורטים',()=>{}],[6,'רפואה, יועץ מנטלי, פרסום',()=>migrateM2()],[7,'צוות, כימיה, מוניטין',()=>{ensureStaff();seedChem();ensureRep()}]];
function runMigrations(){const from=G.v||4;for(const [v,,fn] of MIGRATIONS){if(from<v){try{fn()}catch(e){console.warn('migration',v,e)}}}G.v=SAVE_VERSION;if(from<SAVE_VERSION)G.migratedFrom=from}
function deleteSlot(n){try{localStorage.removeItem(slotKey(n));localStorage.removeItem('ilm2_meta_'+n)}catch(e){}}
async function deleteAllData(){for(let n=1;n<=SLOTS;n++)deleteSlot(n);try{localStorage.removeItem('ilm2_cur')}catch(e){}let cloudOk=true;if(cloud.ready){try{for(let n=1;n<=SLOTS;n++){const base=cloud.db.doc(cloudPath(n));const snap=await base.get();if(snap.exists){const m=snap.data();for(let i=0;i<(m.n||0);i++)await base.collection('chunks').doc('c'+i).delete();await base.delete()}}cloud.meta=null}catch(e){cloudOk=false}}G=null;render();toast(cloudOk?'כל הנתונים נמחקו (מקומי וענן)':'הנתונים המקומיים נמחקו. המחיקה בענן נכשלה, נסה שוב.')}
function load(slot){try{const sl=slot||curSlot();const s=localStorage.getItem(slotKey(sl));if(s){G=JSON.parse(s);G.slot=sl;const all=[...G.clubs,...G.leumit,...Object.values(G.pseudo)];const wall=G.world?Object.values(G.world).flatMap(l=>l.clubs):[];uid=Math.max(uid,...all.concat(wall).flatMap(c=>[...c.players,...(c.youth||[])].map(p=>p.id)),...(G.scouts||[]).map(s=>s.id),...(G.scoutMarket||[]).map(s=>s.id),...(G.negs||[]).map(n=>n.id))+1;if(G.live)G.live=null;if(!G.paper)G.paper=[];if(!G.world)G.world={};if(!G.scouts)G.scouts=[];if(!G.scoutMarket)G.scoutMarket=[];if(!G.reports)G.reports=[];if(!G.negs)G.negs=[];if(!G.payables)G.payables=[];if(G.manager&&G.manager.trust==null)G.manager.trust=60;G.clubs.forEach(c=>{if(!c.div)c.div='top'});G.leumit.forEach(c=>{if(!c.div)c.div='leumit';if(c.tier==null)c.tier=4});if(G.leumit.length<16){const have=new Set(G.leumit.map(c=>c.name));for(const d of LEUMIT16){if(G.leumit.length>=16)break;if(!have.has(d.name)&&!G.clubs.some(c=>c.name===d.name))G.leumit.push(buildLeumitClub(d))}}if(!G.lfx||!G.lsched){buildLeumitSeason();G.leumit.forEach(c=>Object.assign(c,{P:0,W:0,D:0,L:0,GF:0,GA:0,pts:0}))}if(!G.toto)buildToto();if(!G.hist)G.hist=[];computeLeumitPrestige();for(const c of all){if(c.scouting==null)c.scouting=1;for(const p of [...c.players,...(c.youth||[])])assignPers(p);if(c.fans==null)c.fans=baseFans(c);if(!c.focus)c.focus='bal';if(!c.intensity)c.intensity='mid';for(const p of [...c.players,...c.youth]){if(p.morale==null)p.morale=65;if(p.fit==null)p.fit=100}}migrateM2();ensureStaff();seedChem();runMigrations();if(G.phase==='play'&&G.cal&&G.wk<G.cal.length)ensureDraws();return true}}catch(e){}return false}

/* ====================== WEEKLY TRAINING PLAN ======================
   Five sessions a week. The plan is applied once, when the week is processed: changing it repeatedly does nothing extra. */
const SESS={tech:{he:'טכניקה',load:2,desc:'התפתחות כללית של השחקנים'},att:{he:'התקפה',load:2,desc:'חלוצים וקשרים מתפתחים מהר יותר'},def:{he:'הגנה',load:2,desc:'מגנים ושוערים מתפתחים מהר יותר'},
  tac:{he:'טקטיקה',load:1.5,desc:'היכרות טקטית: בונוס כוח במשחקים'},fit:{he:'כושר',load:3,desc:'מאגר כושר: פחות שחיקה ופציעות בהמשך, עייפות השבוע'},rec:{he:'התאוששות',load:.5,desc:'כושר גופני חוזר מהר, פצועים חוזרים מהר'},
  prep:{he:'הכנה ליריבה',load:1,desc:'בונוס למשחק הבא בלבד'},youth:{he:'שילוב נוער',load:1,desc:'הנוער מתפתח מהר יותר'},off:{he:'מנוחה',load:0,desc:'מורל והתאוששות, בלי התפתחות'}};
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי'];
const PLAN_PRESETS={bal:{he:'מאוזן',d:['tech','tac','fit','prep','rec']},dev:{he:'פיתוח',d:['tech','att','def','tech','rec']},big:{he:'לפני משחק גדול',d:['tac','tac','rec','prep','off']},fit:{he:'בניית כושר',d:['fit','tech','fit','tac','rec']},rec:{he:'שבוע עמוס',d:['rec','tac','rec','prep','off']},youth:{he:'נוער',d:['youth','tech','youth','tac','rec']}};
function planOf(c){if(!c.plan||c.plan.length!==5)c.plan=PLAN_PRESETS.bal.d.slice();if(c.tacFam==null)c.tacFam=60;if(c.cond==null)c.cond=60;return c.plan}
function planFx(c){const d=planOf(c);const n=k=>d.filter(x=>x===k).length;const load=d.reduce((t,k)=>t+(SESS[k]?SESS[k].load:0),0);
  return {load,n,dev:clamp(.78+.16*n('tech')+.06*(n('att')+n('def'))+.04*n('tac')+(load>9?.06:0),.5,1.6),att:n('att'),def:n('def'),
    rec:-(load-6)*1.6+4*n('rec')+3*n('off'),inj:clamp(Math.pow(Math.max(.3,load/7),1.7),.25,3.2),tac:5*n('tac')-4,cond:5*n('fit')-3,prep:n('prep')>0,youth:1+.3*n('youth'),morale:n('off')-(load>10?1:0)}}
function planIntensity(load){return load<=5?'low':load<=9?'mid':'high'}
function applyTrainingWeek(c){const fx=planFx(c);c.intensity=planIntensity(fx.load);
  c.tacFam=clamp(c.tacFam+fx.tac,10,100);c.cond=clamp(c.cond+fx.cond,10,100);c.prepLeft=fx.prep?1:0;
  if(fx.morale)for(const p of c.players)p.morale=clamp((p.morale??65)+fx.morale,0,100);

function riskWord(m){return m<.6?'נמוך':m<1.1?'רגיל':m<1.8?'גבוה':'גבוה מאוד'}
function trainingPlanHTML(c){const d=planOf(c);const fx=planFx(c);const loadN=Math.round(clamp(fx.load/15*10,0,10));
  return `<div class="card"><div class="row between wrap"><h3 class="sec">תוכנית אימונים שבועית</h3><span class="tag ${fx.load>10?'bad':fx.load>8?'warn':'good'}">עומס ${fx.load.toFixed(1)}</span></div>

   archive never rewrites history. Presentation only: opening or closing a paper never touches the event itself. */
const NP_IMG={manager:['np-manager',900,600],stage:['np-stage',400,267],champ:['np-champ',900,600],cup:['np-cup',900,600],ashdod:['np-ashdod',863,561]};
const NP_RIBBON={loanOut:'יוצא בהשאלה',appoint:'מינוי חדש',sign:'רכש חדש',loan:'רכש חדש · השאלה',sale:'יוצא מהמועדון',sponsor:'עסקים וספורט',champ:'לילה של אלופים',cup:'לילה של גביע'};
function npSeasonOf(st){const y=2026+(st.s||1)-1;return `${y}/${String(y+1).slice(2)}`}
function npTypeOf(st){if(st.ev&&st.ev.type)return st.ev.type;const h=st.h||'';if(/אלופת המדינה/.test(h))return 'champ';if(/זכתה בגביע|זכתה ב.*גביע/.test(h))return 'cup';return null}
function npImage(st){const t=npTypeOf(st),ev=st.ev||{};
  if(t==='champ')return {k:'champ',cap:'חגיגות האליפות · אילוסטרציה'};if(t==='cup')return {k:'cup',cap:'הגביע מונף · אילוסטרציה'};
  if(t==='appoint')return ev.clubId==='l_ash'?{k:'ashdod',cap:'רגע החתימה · אילוסטרציה'}:{k:'manager',cap:'בדרך אל הדשא · אילוסטרציה'};
  if(t==='sign'||t==='loan'||t==='sale'||t==='loanOut')return {k:'stage',shirt:true,cap:t==='sale'?'במה ריקה · אילוסטרציה':'במת ההצגה · אילוסטרציה'};
  if(t==='sponsor')return {k:'stage',board:ev.sponsor,cap:'מעמד ההכרזה · אילוסטרציה'};
  const k=st.kind;if(k==='העברות'||k==='כספים'||k==='מסחרי')return {k:'stage',cap:'אילוסטרציה'};return {k:'manager',cap:'אילוסטרציה'}}
function npShirtFor(st){const ev=st.ev||{};const id=ev.type==='sale'?ev.buyerId:ev.type==='loanOut'?ev.toId:(ev.clubId||st.team);const c=club(id);return c||null}
function npFigure(st,lazy){const im=npImage(st);const [f,w,h]=NP_IMG[im.k];const c=im.shirt?npShirtFor(st):null;const ev=st.ev||{};
  return `<figure class="np-fig"><div class="np-ph"><picture><source srcset="${f}.webp" type="image/webp"><img src="${f}.jpg" width="${w}" height="${h}" alt="" ${lazy?'loading="lazy" ':''}decoding="async" onerror="this.closest('.np-ph').classList.add('np-noimg')"></picture>
   ${c?`<div class="np-shirt">${shirtSVG(c,ev.type==='sale'?null:ev.no,'np'+Math.random().toString(36).slice(2,6))}</div>`:''}${im.board?`<div class="np-board"><bdi>${esc(im.board)}</bdi></div>`:''}</div>
   <figcaption><b>${esc(im.cap.split(' · ')[0])}:</b> ${esc(im.cap.split(' · ')[1]||'')}</figcaption></figure>`}
const yrs=n=>n==null?null:`${n} ${n>1?'עונות':'עונה'}`;
function npFacts(st){const ev=st.ev||{},t=npTypeOf(st);const c=club(st.team)||null;const F=[];const add=(l,v)=>{if(v!=null&&v!=='')F.push([l,v])};
  if(t==='appoint'){add('החוזה',yrs(ev.years));add('המועדון',ev.club);add('היעד',ev.goal)}
  else if(t==='sign'){add('עמדה',ev.pos&&POSHE[ev.pos]);add(ev.free?'סוג העסקה':'דמי העברה',ev.free?'שחקן חופשי':(ev.fee!=null?NIS(ev.fee):null));add('החוזה',yrs(ev.years))}
  else if(t==='loan'){add('מועדון האם',ev.parent);add('משך',ev.until?`עד סוף ${ev.until}`:null);if(ev.buy)add('אופציית רכישה',NIS(ev.buy));else add('מועדון קולט',ev.club)}
  else if(t==='loanOut'){add('המועדון המקבל',ev.to);add('עד',ev.until?`סוף ${ev.until}`:null);add('עמדה',ev.pos&&POSHE[ev.pos])}
  else if(t==='sale'){add('הקונה',ev.buyer);add('הסכום',ev.fee!=null?NIS(ev.fee):null);add('גיל',ev.age!=null?String(ev.age):null)}
  else if(t==='sponsor'){add('נותן החסות',ev.sponsor);add('לעונה',ev.annual!=null?NIS(ev.annual):null);add('משך',yrs(ev.years))}
  else if(t==='champ'){add('העונה',ev.season);add('נקודות',ev.pts!=null?String(ev.pts):null);add('סגנית',ev.second)}
  else if(t==='cup'){add('המפעל',ev.comp);add('תוצאת הגמר',ev.score?`${ev.score}${ev.pens?' (פנדלים)':''}`:null);add('היריבה',ev.opp)}
  if(F.length<3){add('המועדון',c?(c.short||c.name):null);add('המדור',st.kind);add('העונה',npSeasonOf(st))}
  const seen=new Set();return F.filter(([l])=>!seen.has(l)&&seen.add(l)).slice(0,3)}
function npTeaser(st,live){if(live){try{const nx=myNextMatch();if(nx)return `המשחק הבא: ${nx.h.id===G.me?'נגד '+nx.a.short:'ב'+nx.h.short}`}catch(e){}}
  const t=npTypeOf(st);return {appoint:'האתגר הבא: בניית הסגל',sign:'האתגר הבא: מקום בהרכב',loan:'האתגר הבא: להוכיח את עצמו',sale:'האתגר הבא: למלא את החסר',sponsor:'האתגר הבא: להחזיר על ההשקעה',champ:'האתגר הבא: להגן על התואר',cup:'האתגר הבא: עוד תואר'}[t]||'עוד בעיתון: הכתבות של השבוע'}
function npSplit(text){const parts=String(text||'').split(/(?<=[.!?״"])\s+/).filter(Boolean);if(parts.length<2)return [text||'',''];const half=Math.ceil(parts.length/2);return [parts.slice(0,half).join(' '),parts.slice(half).join(' ')]}
function npQuote(st){const m=st.body&&st.body.match(/"([^"]{8,90})"/);if(m)return m[1];return st.q||null}
function frontPageHTML(st,o){o=o||{};const t=npTypeOf(st);const c=club(st.team);const [b1,b2]=npSplit(st.body);const q=npQuote(st)||(st.ev&&st.ev.q)||null;
  const ribbon=NP_RIBBON[t]||st.kind;const by=st.by||'מאת הכתב הספורטיבי';
  return `<article class="np" dir="rtl" aria-labelledby="npH">
   <header class="np-head"><div class="np-brand"><span class="np-logo" dir="ltr"><b>GOAL</b><i>ASSO</i></span><small>מהדורת המועדון</small></div>
    <div class="np-title">${PAPER_NAME}</div>
    <div class="np-meta"><span>עונת <bdi dir="ltr">${npSeasonOf(st)}</bdi> · שבוע ${st.wk+1}</span><span class="np-red" aria-hidden="true"></span><span>${esc(o.label||(st.demo?'הדגמה':'מהדורה מיוחדת'))}</span></div></header>
   <div class="np-ribbon">${esc(ribbon)}</div>
   <h2 class="np-hl" id="npH">${esc(st.h)}</h2>${st.sub?`<p class="np-sub">${esc(st.sub)}</p>`:''}
   ${npFigure(st,o.lazy)}
   <div class="np-cols ${b2?'':'one'}"><div class="np-text"><p class="np-by">${esc(by)}</p><p>${esc(b1)}</p>${b2?`<p>${esc(b2)}</p>`:''}</div>${q?`<blockquote class="np-q"><p>"${esc(q)}"</p><footer>מתוך הסיקור הבדיוני של המשחק</footer></blockquote>`:''}</div>
   <dl class="np-facts">${npFacts(st).map(([l,v])=>`<div><dt>${esc(l)}</dt><dd><bdi>${esc(v)}</bdi></dd></div>`).join('')}</dl>
   <div class="np-banner"><span>${esc(npTeaser(st,!st.demo&&o.live))}</span><svg viewBox="0 0 40 20" aria-hidden="true"><path d="M22 3l-7 7 7 7M34 3l-7 7 7 7" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
   <footer class="np-foot">חדשות מתוך עולם המשחק</footer></article>`}
/* ---- modal: own dialog (focus, Escape, scroll lock, safe areas). Never mutates the story's event. ---- */
let NPM=null;
function openFrontPage(st,opts){opts=opts||{};closeFrontPage(true);const prevFocus=document.activeElement;const sy=window.scrollY;
  const root=document.createElement('div');root.id='npModal';root.className='npm';root.setAttribute('role','dialog');root.setAttribute('aria-modal','true');root.setAttribute('aria-labelledby','npH');
  const nextN=opts.queue?G.paperPop.length:0;
  root.innerHTML=`<div class="npm-scroll"><button class="npm-x" type="button" data-npclose aria-label="סגור">✕</button>${frontPageHTML(st,{live:opts.live,lazy:false})}</div>
   <div class="npm-bar">${nextN?`<button class="btn" type="button" data-npnext>לכתבה הבאה (${nextN})</button>`:''}<button class="btn ${nextN?'sec':''}" type="button" data-npclose>סגור</button>${opts.queue?`<button class="btn sec" type="button" data-npoff>בלי פופ-אפים של עיתון</button>`:''}</div>`;
  document.body.appendChild(root);const lockPrev=document.body.style.overflow;document.body.style.overflow='hidden';
  const onKey=e=>{if(e.key==='Escape'){e.preventDefault();closeFrontPage()}else if(e.key==='Tab'){const f=[...root.querySelectorAll('button')];if(!f.length)return;const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}};
  const onClick=e=>{const t=e.target;if(t===root||t.closest('[data-npclose]'))return closeFrontPage();if(t.closest('[data-npnext]')){closeFrontPage(true);return showPaperPop()}if(t.closest('[data-npoff]')){G.paperPopOff=true;G.paperPop=[];save();closeFrontPage();toast('אפשר להפעיל שוב בהגדרות')}};
  document.addEventListener('keydown',onKey);root.addEventListener('click',onClick);
  NPM={root,onKey,onClick,prevFocus,lockPrev,sy};setTimeout(()=>{const b=root.querySelector('.npm-bar .btn');try{b&&b.focus({preventScroll:true})}catch(e){}},30)}
function closeFrontPage(silent){const m=NPM;NPM=null;if(!m)return;document.removeEventListener('keydown',m.onKey);m.root.removeEventListener('click',m.onClick);m.root.remove();document.body.style.overflow=m.lockPrev||'';try{window.scrollTo(0,m.sy)}catch(e){}if(!silent){try{m.prevFocus&&m.prevFocus.focus&&m.prevFocus.focus({preventScroll:true})}catch(e){}}}
function showPaperPop(){if(!G||!G.paperPop||!G.paperPop.length||$('modal')||revealOpen||NPM)return;const st=G.paperPop.shift();save();openFrontPage(st,{queue:true,live:true})}
function openArchiveStory(i){const st=(G.paper||[])[i];if(st)openFrontPage(st,{live:false})}
/* ---- previews: demo data only, nothing saved ---- */
function paperDemo(type){if(!G)return;const c=me();const base={wk:G.wk,s:G.season,team:c.id,demo:true};const other=G.clubs.find(x=>x.id!==G.me&&x.league)||c;const p=c.players.slice().sort((a,b)=>b.ovr-a.ovr)[0];
  const D={
   appoint:{kind:'מועדון',h:`${G.manager.name} חתם ב${c.name}`,sub:`חוזה לשתי עונות. המטרה: ${G.board.expectText}`,body:`${c.name} הציגה היום את המנג'ר החדש. ההנהלה הציבה יעד ברור: ${G.board.expectText}. העבודה מתחילה כבר באימון הקרוב.`,ev:{type:'appoint',manager:G.manager.name,club:c.name,clubId:c.id,years:2,goal:G.board.expectText},q:'באתי לבנות קבוצה שאנשים יתגאו בה'},
   perm:{kind:'העברות',h:`${fullName(p)} חתם ב${c.name}`,sub:`${c.short} שילמה ${NIS(askingPrice(p))} ל${other.short}; חוזה ל-3 עונות`,body:`${fullName(p)}, ${POSHE[p.pos]} בן ${p.age}, הוא הרכש החדש של ${c.name}. הוא צפוי להתחרות על מקום בהרכב כבר במחזור הקרוב.`,ev:{type:'sign',player:fullName(p),pos:p.pos,age:p.age,no:p.no||null,club:c.name,clubId:c.id,from:other.short,fee:askingPrice(p),years:3}},
   loan:{kind:'העברות',h:`${fullName(p)} בהשאלה ל${c.name}`,sub:`מ${other.short}, לעונה אחת`,body:`${c.name} סגרה השאלה של ${fullName(p)} (${POSHE[p.pos]}, ${p.age}). המנג'ר מאמין שהוא ייכנס להרכב מיד.`,ev:{type:'loan',player:fullName(p),pos:p.pos,age:p.age,no:p.no||null,club:c.name,clubId:c.id,parent:other.short,until:seasonLabel(),buy:null}},
   sponsor:{kind:'כספים',h:`${c.name} חתמה עם ${SPONSORS[0]}`,sub:`חסות חולצה של ${NIS(1200000)} לעונה ל-2 עונות`,body:`הלוגו של ${SPONSORS[0]} יופיע על חולצת ${c.name} כבר במשחק הבא. במועדון מסבירים שהכסף יופנה לשכר השחקנים ולתשתיות.`,ev:{type:'sponsor',sponsor:SPONSORS[0],club:c.name,clubId:c.id,annual:1200000,years:2}},
   champ:{kind:'ליגה',h:`${c.name} אלופת המדינה ${seasonLabel()}`,sub:'העונה הסתיימה במקום הראשון',body:`${c.name} סיימה את העונה במקום הראשון. חגיגות ענק בעיר.`,ev:{type:'champ',club:c.name,clubId:c.id,season:seasonLabel(),pts:78,second:other.short}},
   cup:{kind:'גביע',h:`${c.name} זכתה בגביע המדינה!`,sub:`2:1 מול ${other.short}`,body:`חגיגות ענק בעיר אחרי השריקה. ${c.name} מניפה את הגביע.`,ev:{type:'cup',comp:'גביע המדינה',club:c.name,clubId:c.id,score:'2:1',opp:other.short,pens:false}}};

/* ====================== MANAGER REPUTATION · INTERVIEWS · RESIGNATION ====================== */
function repWord(r){return r>=85?'אגדה':r>=70?'מוערך מאוד':r>=55?'מבוסס':r>=40?'מבטיח':'אלמוני'}
function ensureRep(){if(G&&G.manager&&G.manager.rep==null){const c=me();G.manager.rep=clamp(30+(15-(c.prestige||10))*2,25,60)}}
function addRep(d,why){ensureRep();G.manager.rep=clamp(Math.round(G.manager.rep+d),0,100);if(why)news(`מוניטין המנג'ר ${d>0?'עלה':'ירד'} (${d>0?'+':''}${d}): ${why}.`)}
function interviewModal(to,onDone){const exp=to.prestige<=2?'אליפות':to.prestige<=4?'אירופה':to.prestige<=8?'אמצע הטבלה':'הישארות בליגה';let step=0;const ans={};
  const Q=[{q:`הבעלים של ${to.name}: "מה התוכנית שלך לעונה הקרובה?"`,a:[['amb','"לנצח. אני כאן בשביל תארים."','יעד גבוה יותר, שכר ‎+15%, ההנהלה פחות סבלנית'],['real','"לבנות קבוצה יציבה ולהתקדם בהדרגה."','יעד רגיל, שכר רגיל'],['mod','"קודם כל לייצב. אני צריך זמן."','יעד נמוך יותר, שכר ‎-10%, יותר סבלנות']]},
    {q:'"איך אתה עובד עם שחקנים צעירים?"',a:[['youth','"הם העתיד. ייקבלו דקות."','אוהדים +2, יעד לשלב נוער'],['win','"מי שטוב, משחק. גיל לא משנה."','ללא שינוי'],['buy','"אני צריך תקציב רכש, לא ניסויים."','‎+10% תקציב פתיחה, אמון התחלתי ‎-5']]}];
  const d=openModal('',e=>{const b=e.target.closest('[data-ia]');if(!b)return;ans[step]=b.dataset.ia;step++;if(step<Q.length)draw();else{closeModal();onDone(ans)}});d.dataset.lock='1';
  function draw(){const x=Q[step];d.querySelector('.card').innerHTML=`<h3 class="sec">ראיון עבודה · ${esc(to.name)}</h3><div class="muted tiny">שאלה ${step+1} מתוך ${Q.length} · היעד הצפוי: ${exp}</div><p style="margin:10px 0">${esc(x.q)}</p><div class="list">${x.a.map(([k,t,fx])=>`<button class="plan" data-ia="${k}"><b>${esc(t)}</b><small>${esc(fx)}</small></button>`).join('')}</div>`}draw()}
function applyInterview(ans){const c=me();if(ans[0]==='amb'){G.manager.wage=Math.round(G.manager.wage*1.15/1000)*1000;G.board.expectRank=Math.max(1,G.board.expectRank-2);G.board.conf=clamp(G.board.conf-5,0,100)}if(ans[0]==='mod'){G.manager.wage=Math.round(G.manager.wage*.9/1000)*1000;G.board.expectRank=Math.min(14,G.board.expectRank+2);G.board.conf=clamp(G.board.conf+8,0,100)}
  if(ans[0]!=='real'){G.board.expectText=expectTextFor(G.board.expectRank)}if(ans[1]==='youth'){c.fans=clamp((c.fans||50)+2,10,100);G.board.youthGoal=true}if(ans[1]==='buy'){const add=Math.round(c.money*.1/1e5)*1e5;c.money+=add;addLog('תוספת תקציב מהבעלים (ראיון)',add);G.board.conf=clamp(G.board.conf-5,0,100)}
  news(`סוכם עם ההנהלה: היעד "${G.board.expectText}", שכר ${NIS(G.manager.wage)} לשבוע.`)}
function resignJob(){openModal(`<h3 class="sec">להתפטר מ${esc(me().name)}?</h3><p class="small">תקבל רשימת מועדונים שמעוניינים בך לפי המוניטין שלך (${G.manager.rep}, ${repWord(G.manager.rep)}). התפטרות פוגעת קצת במוניטין (‎-3), ואין פיצוי על יתרת החוזה.</p><div class="actions"><button class="btn danger" id="resignGo">כן, להתפטר</button><button class="btn sec" data-close>ביטול</button></div>`,e=>{if(e.target.closest('#resignGo')){closeModal();const c=me();addRep(-3);G.manager.history.push({season:seasonLabel(),club:c.name,pos:myPos(),cup:false,left:true,resigned:true});news(`${G.manager.name} התפטר מ${c.name}.`);paperMajor('מועדון',`${G.manager.name} מתפטר מ${c.name}`,'החלטה מפתיעה',`המנג'ר הודיע להנהלה על סיום דרכו במועדון. "הרגשתי שמיציתי", אמר (ציטוט בדיוני).`);
  const r=G.manager.rep;const pool=shuffle(G.clubs.filter(x=>x.id!==G.me&&x.league&&(r>=70||x.prestige>=Math.max(1,8-Math.floor(r/12)))));G.jobOffers=pool.slice(0,3).map(x=>x.id);G.phase='fired';save();render()}})}
/* ====================== STORYLINES (decisions with delayed consequences) ====================== */
function storyAdd(o){G.stories=G.stories||[];G.storySeq=(G.storySeq||0)+1;const st={id:G.storySeq,s:G.season,wk:G.wk,...o};G.stories.push(st);return st}
function activeStories(){return (G.stories||[]).filter(x=>!x.done&&x.s===G.season)}
function storyPlayer(st){return me().players.find(p=>p.id===st.pid)}
function storyTick(){const c=me();if(!c||G.phase!=='play')return;G.stories=(G.stories||[]).filter(x=>x.s>=G.season-1);
  for(const st of activeStories()){const p=storyPlayer(st);if(!p&&st.pid){st.done=true;continue}
    if(st.type==='prospect'){
      if(st.stage==='promised'&&p.promise&&p.promise.left<=0){st.stage='judged'}
      if(st.stage==='promised'||st.stage==='judged'){const big=G.results.filter(r=>(r.h===G.me||r.a===G.me)&&r.wk>=st.wk&&r.ps&&r.ps[G.me]&&r.ps[G.me][p.id]&&r.ps[G.me][p.id].min>=45);const best=big.slice().sort((a,b)=>b.ps[G.me][p.id].r-a.ps[G.me][p.id].r)[0];

function challengeProgress(id){const c=me();const rs=G.results.filter(r=>(r.h===G.me||r.a===G.me)&&r.kind!=='friendly');const L=rs.filter(r=>r.kind==='league');const res=r=>{const gf=r.h===G.me?r.gh:r.ga,ga=r.h===G.me?r.ga:r.gh;return [gf,ga]};

const UNIT_HE={def:'הגנה',mid:'קישור',att:'התקפה'};
function unitOf(pos){return pos==='GK'||pos==='DF'?'def':pos==='MF'?'mid':'att'}

function chemAfterMatch(M,c,R){if(!c.chem)c.chem={};const xs=[...M.xi[c.id].map(e=>e.pid),...M.used[c.id]];const mins=pid=>(R&&R[pid]?R[pid].min:0);

function unitChem(c,ids){const ps=ids.map(id=>c.players.find(p=>p.id===id)).filter(Boolean);const out={};for(const u of ['def','mid','att']){const g=ps.filter(p=>unitOf(p.pos)===u);let sum=0,n=0,weak=null;
    for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){const v=Math.min(1,((c.chem||{})[pairKey(g[i].id,g[j].id)]||0)/900);sum+=v;n++;if(!weak||v<weak.v)weak={v,a:g[i],b:g[j],m:(c.chem||{})[pairKey(g[i].id,g[j].id)]||0}}
    out[u]={v:n?sum/n:.6,weak}}return out}
function chemBonus(c,M){if(!c.chem)return 0;const U=unitChem(c,M.xi[c.id].map(e=>e.pid));const avg=(U.def.v*1.2+U.mid.v+U.att.v*.8)/3;return (avg-.55)*.9}

   <div class="muted tiny" style="margin-top:4px">הכימיה נבנית מדקות משחק משותפות של שחקנים באותו קו (900 דקות = הבנה מלאה). שחקנים חדשים מתחילים מאפס.</div></div>`}

function devFactors(c,p){const sh=(p.sharp??70)/100;const coach=1+.1*((c.training||1)-1)+.05*staffD('asst');const {intensity}=trainCfg(c);const load=intensity==='high'?1.2:intensity==='low'?.8:1;const pers=p.pers==='professional'?1.15:p.pers==='ambitious'?1.1:p.pers==='temperamental'?.9:1;

    if(d.retrain){d.rprog=(d.rprog||0)+3*F*(p.age>=30?.6:1);if(d.rprog>=100){p.pos2=d.retrain;news(`${fullName(p)} סיים הסבה ל${POSHE[d.retrain]}: עכשיו הוא יכול לשחק שם כמעט בלי פגיעה.`);d.retrain=null;d.rprog=0}}
    if(d.spec){const played=(p.sharp??70)>=60;if(roleOf(p)===d.spec&&played){d.sprog=(d.sprog||0)+7*F;if(d.sprog>=100){p.roleM=d.spec;news(`${fullName(p)} התמחה בתפקיד ${ROLES[p.pos][d.spec]}.`);d.spec=null;d.sprog=0}}}

function analystConf(c,opp){const met=(G.results||[]).some(r=>(r.h===opp.id||r.a===opp.id)&&(r.h===c.id||r.a===c.id));const domestic=G.clubs.includes(opp)||G.leumit.includes(opp);return clamp(Math.round(48+12*staffD('anl')+(staffSpec('anl','opp')?8:0)+(met?10:0)+(domestic?8:-6)+(opp.pseudo?-8:0)),30,95)}
function oppXI(opp){return bestXI(opp)}
function oppIntel(c,opp){const xi=oppXI(opp);const by=pos=>xi.filter(p=>p.pos===pos);const dang=xi.slice().sort((a,b)=>effOvr(b)+(b.goals||0)*.6-(effOvr(a)+(a.goals||0)*.6)).slice(0,3);
  const df=by('DF');const weakDF=df.slice().sort((a,b)=>a.ovr-b.ovr)[0];const dfPace=df.length?df.reduce((t,p)=>t+attrs(p)[0],0)/df.length:65;const gk=by('GK')[0];const avg=xi.reduce((t,p)=>t+p.ovr,0)/Math.max(1,xi.length);
  const fit=xi.reduce((t,p)=>t+(p.fit??100),0)/Math.max(1,xi.length);const absent=opp.players.filter(p=>(p.inj>0||p.susp>0)).sort(byOvr).slice(0,3);const setp=[...df,...by('FW')].map(p=>attrs(p)[5]).sort((a,b)=>b-a).slice(0,4);const setv=setp.length?setp.reduce((a,b)=>a+b,0)/setp.length:60;
  const fbWide=df.filter(p=>roleOf(p)==='wingback').length;const ga=opp.P?opp.GA/opp.P:null;return {xi,dang,weakDF,dfPace,gk,avg,fit,absent,setv,fbWide,ga}}
function planOptions(c,opp,I){const t=tacOf(opp);const star=I.dang[0];
  return [['none','—','בלי שינוי: הטקטיקה שלך כפי שהיא.'],
   ['press',t.style==='possession'||I.fit<80?'מתאים':'סיכון',`לחץ על המוסרים שלהם. משתלם מול קבוצה שבונה מאחור${I.fit<80?' ועייפה':''}. עולה באנרגיה: העייפות שלנו עולה ב-20%.`],
   ['block',t.style==='counter'?'סיכון':'מתאים','סוגרים את המרווחים ומחכים. היריבה תייצר פחות, אבל גם אנחנו, וההחזקה יורדת.'],
   ['direct',I.dfPace<64?'מתאים':'סיכון',`כדורים ארוכים לעומק${I.dfPace<64?' מול קו הגנה איטי':''}. מוותרים על החזקה בשביל מצבים מהירים.`],
   ['mark',star?'מתאים':'—',star?`שחקן שלנו מוצמד ל${fullName(star)}: הוא יבעט פחות, אבל אנחנו מאבדים קצת מהיכולת לבנות.`:''],
   ['wide',I.fbWide?'מתאים':'סיכון',`מעמיסים על האגפים${I.fbWide?': המגנים שלהם עולים ומשאירים שטח':''}. יותר קרנות והגבהות, ופחות כיסוי באמצע.`]]}
function analystReportHTML(c,opp,nm){if(!opp||!opp.players||!opp.players.length)return '';const conf=analystConf(c,opp);const I=oppIntel(c,opp);const t=tacOf(opp);const ev=currentEvent()||{};
  const plan=(G.plan&&G.plan.opp===opp.id&&G.plan.wk===G.wk&&G.plan.s===G.season)?G.plan:null;const pk=plan?plan.kind:'none';
  const form=G.results.filter(r=>(r.h===opp.id||r.a===opp.id)&&r.kind!=='friendly').slice(-5).map(r=>{const gf=r.h===opp.id?r.gh:r.ga,ga=r.h===opp.id?r.ga:r.gh;return `<i class="fm ${gf>ga?'w':gf===ga?'d':'l'}">${gf>ga?'נ':gf===ga?'ת':'ה'}</i>`}).join('');
  const lvl=conf>=75?['גבוה','good']:conf>=55?['בינוני','warn']:['נמוך','bad'];

  const fat=[];if(I.fit<85)fat.push(`כושר ממוצע בהרכב הצפוי: ${Math.round(I.fit)}%`);if(I.absent.length)fat.push('חסרים: '+I.absent.map(p=>`${fullName(p)} (${p.inj>0?(p.injT||'פציעה'):'הרחקה'})`).join(', '));if(!fat.length)fat.push('סגל מלא וטרי');
  return `<div class="analyst"><div class="row between"><b>📊 דוח אנליסט · ${esc(opp.short)}</b><span class="tag ${lvl[1]}">ביטחון ${lvl[0]} · ${conf}%</span></div>
   <div class="an-grid"><div><span class="muted tiny">מערך וסגנון צפויים</span><div class="small">${esc(opp.formation||'4-4-2')} · ${TAC.press[t.press]} · ${TAC.style[t.style]} · ${TAC.tempo[t.tempo]}</div></div><div><span class="muted tiny">כושר אחרון</span><div class="fmrow">${form||'<span class="tiny muted">אין משחקים</span>'}</div></div></div>
   <div class="an-sec"><span class="muted tiny">⚠️ שחקנים מסוכנים</span>${I.dang.map(p=>`<div class="an-pl"><span class="pos ${p.pos}">${POSB[p.pos]}</span><b>${esc(fullName(p))}</b><span class="num">${p.ovr}</span><span class="muted tiny">${p.goals||0} שערים${p.assists?` · ${p.assists} בישולים`:''}${p.rn?` · ציון ${(p.rsum/p.rn).toFixed(1)}`:''}</span></div>`).join('')}</div>
   <div class="an-sec"><span class="muted tiny">🎯 חולשות בהגנה</span><ul>${weak.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>
   <div class="an-sec"><span class="muted tiny">🩹 עייפות ופציעות</span><ul>${fat.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>
   <div class="an-sec"><span class="muted tiny">⛳ כדורים נייחים</span><div class="small">${I.setv>=70?`איום גבוה: שחקנים חזקים באוויר (ממוצע פיזי ${Math.round(I.setv)})`:I.setv>=62?'איום בינוני':'איום נמוך'}</div></div>
   ${conf<55?'<div class="tiny" style="color:var(--warn);margin-top:4px">ביטחון נמוך: ייתכן שהם יפתיעו בגישה אחרת. אנליסט טוב יותר (מועדון ← צוות) משפר את הדוח.</div>':''}
   <div class="an-sec"><span class="muted tiny">התוכנית שלך למשחק</span><div class="plans">${planOptions(c,opp,I).filter(o=>o[0]==='none'||o[2]).map(([k,fit,txt])=>`<button class="plan ${pk===k?'on':''}" data-plan="${k}:${opp.id}"><b>${PLAN_HE[k]}${k==='mark'&&I.dang[0]?': '+esc(I.dang[0].last||I.dang[0].first):''}</b>${fit&&fit!=='—'?`<span class="tag ${fit==='מתאים'?'good':'warn'}">${fit}</span>`:''}<small>${esc(txt)}</small></button>`).join('')}</div></div></div>`}
function setPlan(kind,oppId){const opp=club(oppId);if(!opp)return;const I=oppIntel(me(),opp);G.plan={kind,opp:oppId,wk:G.wk,s:G.season,target:kind==='mark'&&I.dang[0]?I.dang[0].id:null,targetName:kind==='mark'&&I.dang[0]?fullName(I.dang[0]):null,conf:analystConf(me(),opp)};save();render()}
function attachPlan(M,h,a){const mine=h.id===G.me?h:a,opp=h.id===G.me?a:h;const conf=analystConf(mine,opp);M.anConf=conf;
  if(Math.random()<(100-conf)/260){const t={...tacOf(opp)};const alt=['possession','direct','counter','balanced'].filter(x=>x!==t.style);t.style=pick(alt);M.tacOv={[opp.id]:t};M.oppSwitch=t.style}
  const pl=G.plan;if(pl&&pl.opp===opp.id&&pl.wk===G.wk&&pl.s===G.season&&pl.kind!=='none'){M.plan={kind:pl.kind,target:pl.target,targetName:pl.targetName,mult:(.7+.15*staffD('anl'))*(staffSpec('anl','data')?1.1:1),home:h.id===G.me}}
  if(M.oppSwitch)M.ev.push({m:1,t:'note',team:G.me,txt:`${opp.short} הפתיעו: הם משחקים ${TAC.style[M.oppSwitch]} במקום מה שהאנליסט צפה.`})}
function planEffect(M,h,a){const P=M&&M.plan;if(!P)return null;const mine=P.home?h:a,opp=P.home?a:h;const to=tacOfM(M,opp);const k=P.mult||1;const r={home:P.home,own:0,opp:0,ps:0,fat:1};
  const oppFit=avgFit(M,opp);const dfPace=avgAttr(M,opp,'DF',0);
  if(P.kind==='press'){r.own=(to.style==='possession'?.08:.03)+(oppFit<80?.04:0);r.opp=.02;r.ps=.05;r.fat=1.2}
  else if(P.kind==='block'){r.opp=to.style==='counter'?-.03:-.09;r.own=-.05;r.ps=-.06}
  else if(P.kind==='direct'){r.own=dfPace<64?.08:.02;r.ps=-.06}
  else if(P.kind==='mark'){r.own=-.02}
  else if(P.kind==='wide'){r.own=.05;r.opp=.02}
  r.own*=k;r.opp*=k;r.ps*=k;return r}
function planVerdict(r){const P=r.plan;if(!P||P.kind==='none'||!r.ps)return '';const meH=r.h===G.me;const my=meH?r.h:r.a,op=meH?r.a:r.h;const tp=(r.poss[r.h]+r.poss[r.a])||1;const mp=Math.round(r.poss[my]/tp*100);
  const xg=t=>+(r.ev||[]).filter(e=>e.team===t&&e.xg!=null&&(e.t==='shot'||e.t==='goal'||e.t==='pen'||e.t==='penmiss')).reduce((s,e)=>s+e.xg,0).toFixed(2);const mx=xg(my),ox=xg(op);const sh=r.shots[my],osh=r.shots[op];let ok=0;const lines=[];
  if(P.kind==='press'){lines.push(`ההחזקה שלנו: ${mp}%. בעיטות: ${sh} מול ${osh}.`);ok=mp>=52&&sh>=osh?2:mp>=48?1:0}
  else if(P.kind==='block'){lines.push(`היריבה: ${osh} בעיטות, xG ${ox}. אנחנו: ${sh} בעיטות, xG ${mx}.`);ok=ox<1.1?2:ox<1.6?1:0}
  else if(P.kind==='direct'){lines.push(`${sh} בעיטות ו-xG ${mx} עם ${mp}% החזקה בלבד.`);ok=mx>=1.4?2:mx>=.9?1:0}
  else if(P.kind==='mark'){const ps=r.ps[op]&&r.ps[op][P.target];if(ps){lines.push(`${P.targetName}: ${ps.sh} בעיטות, ${ps.g} שערים, ציון ${ps.r}.`);ok=ps.g===0&&ps.r<7?2:ps.g<=1&&ps.r<7.5?1:0}else{lines.push(`${P.targetName} לא שיחק.`);ok=1}}
  else if(P.kind==='wide'){const cr=(r.corners||{})[my]||0;lines.push(`${cr} קרנות, ${sh} בעיטות, xG ${mx}.`);ok=cr>=6&&mx>=1.2?2:cr>=4?1:0}
  if(r.oppSwitch)lines.push(`הם שינו גישה (${TAC.style[r.oppSwitch]}) בניגוד לדוח.`);
  return `<div class="card"><div class="row between"><h3 class="sec">התוכנית: ${PLAN_HE[P.kind]}</h3><span class="tag ${ok===2?'good':ok===1?'warn':'bad'}">${ok===2?'עבדה':ok===1?'עבדה חלקית':'לא עבדה'}</span></div>${lines.map(l=>`<div class="small" style="margin-top:4px">• ${esc(l)}</div>`).join('')}</div>`}
/* ====================== MEDICAL · MENTAL PERFORMANCE · SHARPNESS · ADVERTISING · DATA SOURCES ====================== */
const SPONSOR_RENAME={'ביטוח ישיר פלוס':'ביטוח נבון','שופרסל-מקס':'סל-מקס','אל-על קרגו':'שחקים קרגו','דלק הנגב':'תדלוק הנגב'};
function migrateM2(){if(!G)return;for(const c of [...(G.clubs||[]),...(G.leumit||[])]){if(c.sponsor&&SPONSOR_RENAME[c.sponsor.name])c.sponsor.name=SPONSOR_RENAME[c.sponsor.name];for(const p of c.players||[]){if(p.inj>0&&!p.injT){p.injT=injuryType(p.inj);p.injTot=p.injTot||p.inj}}}
  if(!G.mental)G.mental={left:0,weekly:0,ws:null};if(!G.adOffers)G.adOffers=[];const c=me();if(c){if(!c.ads)c.ads=[];if(!c.adLedger)c.adLedger=[]}}
function mentalActive(){return !!(G&&G.mental&&G.mental.left>0)}
function mentalPrices(c){const top=c.div!=='leumit'&&!G.leumit.includes(c);return {ws:top?220000:90000,weekly:top?48000:20000,weeks:12}}
function weeklyM2(){const c=me();
  for(const x of [...G.clubs,...G.leumit]){const decay=x.id===G.me&&mentalActive()?4:6;for(const p of x.players){p.sharp=clamp((p.sharp??70)-decay,25,100);if(p.fragile>0)p.fragile--}}
  if(G.mental&&G.mental.left>0){c.money-=G.mental.weekly;addLog('יועץ מנטלי · תשלום שבועי',-G.mental.weekly);G.mental.left--;for(const p of c.players)if((p.morale??65)<55)p.morale=clamp(p.morale+1,10,100);if(G.mental.left===2)news('חוזה היועץ המנטלי מסתיים בעוד שבועיים. אפשר להאריך במסך המועדון → צוות.');if(G.mental.left===0)news('חוזה היועץ המנטלי הסתיים.')}
  adsWeekly(c);
}
function setupWorkshop(){const c=me();const pr=mentalPrices(c);const ws=G.mental.ws;if(G.live)return toast('לא במהלך משחק');if(ws&&ws.s===G.season&&G.wk-ws.wk<6)return toast(`הסדנה הבאה אפשרית בעוד ${6-(G.wk-ws.wk)} שבועות`);if(c.money<pr.ws)return toast('אין מספיק תקציב');
  c.money-=pr.ws;addLog('סדנת ביטחון וריכוז',-pr.ws);G.mental.ws={s:G.season,wk:G.wk};for(const p of c.players)p.morale=clamp((p.morale??65)+5,10,100);G.mentalBoost=.5;news('הסגל עבר סדנת ביטחון וריכוז עם יועץ מנטלי חיצוני: מורל +5 ובונוס ריכוז למשחק הבא.');save();render()}
function signMental(){const c=me();const pr=mentalPrices(c);if(G.mental.left>2)return toast('כבר יש חוזה פעיל');if(c.money<pr.weekly*2)return toast('אין מספיק תקציב');

function rehabCost(p){return Math.round(clamp(150000+marketValue(p)*.012,150000,1200000)*(1-.06*staffD('phys'))/1e4)*1e4}
function rehab(pid){const c=me();const p=c.players.find(x=>x.id===pid);if(!p||!(p.inj>0))return;if(G.live)return toast('לא במהלך משחק');if(p.rehabDone)return toast('כבר בוצע שיקום מואץ לפציעה הזו');if(p.inj<2)return toast('הפציעה קצרה מדי לשיקום מואץ');const cost=rehabCost(p);if(c.money<cost)return toast('אין מספיק תקציב');

function viewMedical(){const c=me();const inj=c.players.filter(p=>p.inj>0).sort((a,b)=>b.inj-a.inj);const tired=c.players.filter(p=>!p.inj&&(p.fit??100)<75).sort((a,b)=>(a.fit??100)-(b.fit??100));const frag=c.players.filter(p=>p.fragile>0&&!p.inj);const susp=c.players.filter(p=>p.susp>0);
  const row=p=>{const tot=p.injTot||p.inj;const done=Math.max(0,tot-p.inj);const pct=Math.round(done/Math.max(1,tot)*100);const stage=p.inj<=1?'חזרה הדרגתית לאימונים':pct>=50?'שיקום':'טיפול';const back=G.wk+p.inj<G.cal.length?`שבוע ${G.wk+p.inj+1}`:'העונה הבאה';const cost=rehabCost(p);

  return `<div class="card"><div class="row between"><h3 class="sec">מרכז רפואי</h3><span class="tag ${inj.length?'bad':'good'}">${inj.length} פצועים</span></div>

      ${need?'':`<div class="muted tiny" style="margin-top:8px">על המגרש</div><div class="list">${xs.map(({p,e})=>playerRow(p,'',outId===p.id?'sel':'',`${POSHE[p.pos]} · כושר ${p.form>0?'+':''}${p.form.toFixed(1)}${e.yel?' · 🟨':''}${M.m-e.since>60?' · עייף':''}`).replace('data-pid','data-out')).join('')}</div>`}
      <div class="muted tiny" style="margin-top:8px">ספסל</div><div class="list">${b.map(p=>playerRow(p,'','',`${POSHE[p.pos]} · ${p.age}`).replace('data-pid','data-in')).join('')||'<div class="muted small">אין שחקנים זמינים</div>'}</div>
      ${(()=>{const out=[...M.used[c.id].map(id=>{const p=c.players.find(x=>x.id===id);return p?`${esc(p.last||p.first)} (הוחלף)`:''}),...M.ev.filter(e=>e.team===c.id&&(e.t==='inj'||e.t==='red')).map(e=>`${esc(e.name)} (${e.t==='inj'?'נפצע':'הורחק'})`),...c.players.filter(p=>(p.inj>0||p.susp>0)&&!M.ev.some(e=>e.pid===p.id&&(e.t==='inj'||e.t==='red'))).map(p=>`${esc(p.last||p.first)} (${p.inj>0?'פצוע':'מורחק'})`)].filter(Boolean);return out.length?`<div class="muted tiny" style="margin-top:8px">לא זמינים: ${out.join(' · ')}</div>`:''})()}
      <div class="muted tiny" style="margin-top:4px">${M.subs[c.id]}/${MAX_SUBS} חילופים נוצלו · שחקן שהוחלף לא חוזר למגרש</div>
      <div class="actions" style="margin-top:10px"><button class="btn sec" data-skip>${need?(M.subs[c.id]>=MAX_SUBS||!b.length?'המשך בחוסר':'המשך בלי חילוף (בחוסר)'):'ביטול'}</button></div>`}
    draw();
  }
}

function start(){if(!G&&!load()){const ls=latestSlot();if(ls){setCurSlot(ls.n);load(ls.n)}}if(!window.__ilmNoSplash)showSplash();setTimeout(()=>{if(!G||G.renderer!=='svg')loadPixi()},1200);if(G&&G.live){G.live=null}render();try{if(localStorage.getItem('ilm2_livefl')){localStorage.removeItem('ilm2_livefl');if(G)setTimeout(()=>toast('משחק חי נקטע באמצע. המשחק נשמר מלפני שריקת הפתיחה ויתחיל מחדש.'),400)}}catch(e){}cloudInit().then(()=>{if(splashOpen()){renderSplash();return}if(!G&&cloud.ready&&cloud.meta){const d=openModal(`<h3 class="sec">נמצאה שמירה בענן</h3><p class="small">${esc(cloud.meta.club||'')} · עונת ${esc(cloud.meta.season||'')} · שבוע ${(cloud.meta.wk||0)+1}</p><div class="actions"><button class="btn" id="cloudLoad2">המשך מהענן</button><button class="btn sec" data-close>התחל חדש</button></div>`,e=>{if(e.target.closest('#cloudLoad2')){closeModal();cloudLoad()}})}})}
if(window.claude?.hot?.snapshot)window.claude.hot.snapshot(()=>({}));
window.ILM={get G(){return G},me,render,NIS,myPos,myDiv,standingsOf,club,myNextMatch};
window.claude?.hot?.ready?window.claude.hot.ready(start):start();
</script>
