<title>GOALASSO · מאמן כדורגל</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@400;500;700;800;900&family=Karantina:wght@400;700&family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap">
<style>
/* Layout: one-screen app in a floodlit arena. Dark navy field of view, electric-green primary, gold for ratings,
   player cards (gold/silver/bronze by rating) are the hero element; everything else stays quiet. Single deliberate dark theme. */
:root{--logo:url(__LOGO_IMG__);--spimg:url(__SPLASH_IMG__);
  --bg:#0a1120; --bg2:#111b31; --panel:#14203a; --panel2:#0f1a30; --line:#24335a; --line2:#2f4274;
  --fg:#f1f4ff; --muted:#9aa7c7; --accent:#27f0a6; --accent-deep:#0fb97c; --gold:#ffd34d; --pink:#ff4d8d;
  --good:#3ddc84; --warn:#ffb547; --bad:#ff5c6c; --info:#5cb8ff;
  --display:"Secular One","Heebo",system-ui,sans-serif; --body:"Heebo",system-ui,sans-serif;
  --r:14px; --r-sm:9px;
  color-scheme:dark;
}
html,body{height:100%}
html{overflow:hidden;overflow-x:clip;max-width:100%}body{max-width:100vw;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;direction:rtl;display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(900px 500px at 50% -10%,rgba(39,240,166,.14),transparent 60%),radial-gradient(600px 400px at 100% 100%,rgba(92,184,255,.08),transparent 60%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0c1527}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.2px}
h3{font-size:18px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hide{display:none!important}
.small{font-size:13px}
.tiny{font-size:12px}

/* top bar */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,#132040,#0c1527);border-bottom:1px solid var(--line);padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#top{flex-wrap:wrap;row-gap:6px}
#top .club{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;flex:1 1 100%;min-height:40px;padding-inline:64px}
#top .stats{display:flex;gap:6px;justify-content:center;flex:1 1 100%}
@media (min-width:640px){#top{flex-wrap:nowrap}#top .club{flex:1;justify-content:flex-start;padding-inline:0;min-height:0}#top .stats{flex:0 0 auto}}
#top .club b{font-family:var(--display);font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .stat{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.15;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px 8px;min-width:54px}
#top .stat strong{display:block;color:var(--fg);font-size:14px;font-family:var(--display);font-weight:400}
#top .stat.money strong{color:var(--accent)}

#main{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:14px;max-width:720px;margin-inline:auto}
.view.live-view{max-width:1360px;gap:0}

/* bottom nav */
#nav{display:flex;background:linear-gradient(180deg,#0c1527,#0a1120);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#nav button{flex:1;padding:8px 1px 7px;font-size:10.5px;min-width:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
#nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--accent)}
#nav button.on::before{content:"";position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--accent);border-radius:2px;box-shadow:0 0 10px var(--accent)}

/* kits */
.kit{width:34px;height:34px;flex:none}
.kit.lg{width:72px;height:72px}
.kit.sm{width:20px;height:20px}

/* panels */
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative}
.card::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);border-radius:var(--r) var(--r) 0 0;pointer-events:none}
.card.hero{background:linear-gradient(135deg,#15284a,#0f1a30 60%,#0c1527);border-color:var(--line2)}
.card.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(39,240,166,.22),transparent 65%);pointer-events:none}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:6px}
.sec:not(.btn){display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec:not(.btn)::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px rgba(39,240,166,.6)}

/* player rows */
.pl{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 10px;border-radius:var(--r-sm);background:rgba(17,27,49,.85);border:1px solid var(--line);position:relative;overflow:hidden}
.pl::before{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--tier,#5e6a85)}
.pl.starter{border-color:#2d6b4f;box-shadow:inset 0 0 0 1px rgba(39,240,166,.15)}
.pl.sel{border-color:var(--gold);background:rgba(255,211,77,.12)}
.pl.dim{opacity:.5}
.pl .pos{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;background:#223a2d;letter-spacing:.3px}
.pos.GK{background:#6b5118}.pos.DF{background:#1f4a73}.pos.MF{background:#2a6a3a}.pos.FW{background:#7a2f3a}
.pl .name{flex:1;min-width:0}
.pl .name b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .name small{color:var(--muted);font-size:12px}
.pl .name small .it{display:inline-block;unicode-bidi:isolate}
.pl .name small .it+.it::before{content:"·";margin:0 5px;color:var(--line2)}
.pl .name small .it b{color:var(--fg);font-weight:600}
.pl .ovr{font-family:var(--display);font-size:20px;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;flex:none;color:#111;background:var(--tier,#8e98ab);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.t-gold{--tier:#f3cf5a}.t-silver{--tier:#cfd6e3}.t-bronze{--tier:#c98b5a}.t-unk{--tier:#5e6a85}
.pl .ovr.unk{font-size:12px;letter-spacing:-.3px;color:#eef;background:#2a3550;border:1px dashed #5e6a85}
.neglog{margin:10px 0;padding:8px 10px;border-radius:8px;background:var(--bg2);font-size:13px;display:flex;flex-direction:column;gap:4px;max-height:120px;overflow-y:auto}
.neglog div:last-child{color:var(--fg);font-weight:500}.neglog div{color:var(--muted)}
.negstep{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.press-q{font-family:var(--display);font-size:20px;line-height:1.25;margin-top:6px}
.press-you{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg2);border-right:3px solid var(--gold);font-size:15px}
.press .pl b{font-weight:500}
.tt{padding:8px 10px;border-radius:8px;background:#1a2a48;border-right:3px solid var(--gold)}
.tacs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin-top:8px}
.tacl{display:flex;flex-direction:column;gap:3px;color:var(--muted)}.tacl select{width:100%}
.analysis{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
.tok .rl{font-size:8.5px;color:#dfe6ff;background:rgba(6,12,24,.6);padding:0 5px;border-radius:999px;margin-top:1px;white-space:nowrap;max-width:76px;overflow:hidden;text-overflow:ellipsis}
.field.mini .tok .rl{display:none}
/* 2.5D arena */
.arena{position:relative;border-radius:14px;overflow:hidden;border:1px solid #223055;box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.04);background:#070b1a;line-height:0}
.arena svg{width:100%;height:auto;display:block}
.arena .p25{cursor:pointer}
.arena .ftxt{font-family:var(--display);animation:ftx 1.5s ease-out forwards}
@keyframes ftx{0%{opacity:0;transform:translateY(3px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.arena .floods circle{animation:flick 7s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.86}}
.arena.pulse svg,.arena.pulse-me svg{animation:crowd 1.6s ease-out}
.arena.pulse-me{box-shadow:0 0 0 2px var(--accent),0 18px 60px rgba(39,240,166,.35)}
@keyframes crowd{0%{filter:brightness(1)}12%{filter:brightness(1.35)}100%{filter:brightness(1)}}
.arena-over{position:absolute;inset:0;pointer-events:none;display:flex;align-items:flex-start;justify-content:center;padding:10px}
.arena-over .rp-tag{pointer-events:none;margin-top:16%;flex-wrap:wrap;justify-content:center;max-width:92%;line-height:1.3;background:rgba(6,10,26,.78);border:1px solid var(--line2);color:#fff;font-size:12px;padding:6px 12px;border-radius:999px;display:flex;gap:8px;align-items:center;backdrop-filter:blur(4px)}
.arena-over .rp-tag .dot{width:8px;height:8px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.arena-over .rp-tag .xg{color:var(--gold);font-family:var(--display)}
.arena .intro{pointer-events:auto;position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,22,.86),rgba(5,8,22,.94));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;line-height:1.3;text-align:center;animation:fadein .4s}
@keyframes fadein{from{opacity:0}to{opacity:1}}



.trd{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.trrow{display:grid;grid-template-columns:62px minmax(110px,150px) 1fr;gap:8px;align-items:center}
.trday{font-weight:700;font-size:13px}.trrow select{min-height:40px;width:100%}.trdesc{line-height:1.3}
@media (max-width:420px){.trrow{grid-template-columns:52px 1fr}.trdesc{grid-column:2}}
.trfx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.trfx>div{background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.trfx small{font-size:11px;color:var(--muted)}.trfx b{font-size:15px}
@media (max-width:420px){.trfx{grid-template-columns:repeat(2,minmax(0,1fr))}}
.trbars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.trbars>div{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}.trbars small{font-size:11.5px;color:var(--muted)}
.clubtx{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}@media (max-width:639px){.clubtx{align-items:center}}
.winchip{font:600 11.5px var(--body);border-radius:999px;padding:2px 9px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--muted);cursor:pointer;white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis;min-height:24px}
.winchip.open{color:#c6f24e;border-color:rgba(198,242,78,.45);background:rgba(198,242,78,.08)}
.winchip.open::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#c6f24e;margin-inline-end:6px;vertical-align:1px}
.winchip.soon{color:#ffd34d;border-color:rgba(255,211,77,.5);background:rgba(255,211,77,.08)}.winchip.soon::before{background:#ffd34d}
/* ---- 3D lineup ---- */
.stad{position:relative;width:min(100%,560px);margin-inline:auto;border-radius:18px;background:#05070c;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.stad-3d{transform-style:preserve-3d}
.stad-pitch{position:relative;aspect-ratio:941/1672;border-radius:14px}
.stad-pitch>picture img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px;display:block}
.stad.noimg .stad-pitch{background:repeating-linear-gradient(180deg,#2f7d42 0 6%,#2a7039 6% 12%)}
.stad-light{position:absolute;inset:0;border-radius:14px;pointer-events:none;background:radial-gradient(60% 35% at 50% 45%,rgba(255,255,240,.12),transparent 70%),linear-gradient(180deg,rgba(0,0,0,.25),transparent 18%,transparent 80%,rgba(0,0,0,.35))}
.t3{position:absolute;transform:translate(-50%,-58%);width:clamp(46px,12.2%,68px);cursor:pointer;transform-style:preserve-3d}
.t3-in{display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s}
.t3:hover .t3-in{transform:translateY(-3px)}
.t3.sel .t3-in{transform:translateY(-6px) scale(1.1)}
.t3:focus-visible{outline:none}.t3:focus-visible .fc{outline:2px solid #fff;outline-offset:2px}
.fc{position:relative;width:100%;aspect-ratio:.74;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.fc-face{position:absolute;inset:0;clip-path:polygon(50% 0,100% 6%,100% 86%,50% 100%,0 86%,0 6%);padding:9% 9% 0;display:flex;flex-direction:column;align-items:center;
  background:var(--fcg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.fc::before{content:"";position:absolute;inset:-2px -2px 3px;clip-path:polygon(50% 0,100% 6%,100% 86%,50% 100%,0 86%,0 6%);background:var(--fce);transform:translateY(4px);z-index:-1}
.fc.t-gold{--fcg:linear-gradient(155deg,#fff3b8 0%,#f2d264 28%,#c9971f 62%,#8a6210 100%);--fce:#5c3f06;--fci:#2b1d05}
.fc.t-silver{--fcg:linear-gradient(155deg,#ffffff 0%,#dfe5ee 30%,#a9b4c4 65%,#6b778a 100%);--fce:#3b4352;--fci:#141a24}
.fc.t-bronze{--fcg:linear-gradient(155deg,#ffd7b0 0%,#d99a62 30%,#a5622f 65%,#6a3816 100%);--fce:#40200b;--fci:#26130a}
.fc.unk{--fcg:linear-gradient(155deg,#cfd6e2,#8b96a8);--fce:#3b4352;--fci:#141a24}
.fc.empty{--fcg:linear-gradient(155deg,rgba(255,255,255,.18),rgba(255,255,255,.06));--fce:rgba(0,0,0,.35);--fci:#fff}
.fc.empty .fc-face{justify-content:center;gap:2px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.fc-top{position:absolute;top:9%;left:9%;display:flex;flex-direction:column;align-items:center;line-height:.9;color:var(--fci)}
.fc-ovr{font-family:var(--display);font-size:clamp(15px,4.6vw,22px);color:var(--fci)}
.fc-pos{font:800 clamp(7px,2vw,9px) var(--body);color:var(--fci);opacity:.85;letter-spacing:.3px}
.fc-kit{width:52%;margin-top:15%;transform:translateX(26%)}
.fc-kit .rv-shirt{filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.fc-name{position:absolute;bottom:15%;left:5%;right:5%;text-align:center;font:800 clamp(8.5px,2.5vw,11.5px) var(--body);color:var(--fci);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid rgba(0,0,0,.18);padding-top:2px}
.fc-shine{position:absolute;inset:0;clip-path:polygon(50% 0,100% 6%,100% 86%,50% 100%,0 86%,0 6%);background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 58%);background-size:250% 100%;background-position:120% 0;mix-blend-mode:overlay;pointer-events:none;animation:fcshine 6s ease-in-out infinite}
@keyframes fcshine{0%,70%{background-position:120% 0}100%{background-position:-60% 0}}
.t3.bad .fc{filter:grayscale(.85) drop-shadow(0 6px 8px rgba(0,0,0,.6))}
.t3.oop .fc{filter:drop-shadow(0 0 7px var(--warn)) drop-shadow(0 6px 8px rgba(0,0,0,.6))}
.t3.sel .fc{filter:drop-shadow(0 0 12px var(--gold)) drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.t3 .capb{position:absolute;left:-2px;top:-2px;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#1b1300;font-family:var(--display);font-size:12px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:2}
.t3-nm{margin-top:3px;font:800 11.5px/1.15 var(--body);color:#fff;background:rgba(6,10,20,.88);padding:2px 8px;border-radius:999px;max-width:110%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.t3.sel .t3-nm{background:var(--gold);color:#1b1300}.t3.bad .t3-nm{background:#7a2a36}
.m10{display:flex;align-items:center;gap:2px;background:rgba(6,10,20,.78);padding:2px 3px;border-radius:5px;margin-top:1px}
.m10i{display:grid;place-items:center;width:9px;height:9px}.m10i svg{width:9px;height:9px}
.m10b{display:flex;direction:ltr}
.m10b{gap:.9px}.m10b b{width:2.6px;height:7px;border-radius:1px;background:rgba(255,255,255,.14)}
.m10b b.on{background:hsl(var(--h) 85% 50%);box-shadow:0 0 3px hsl(var(--h) 85% 50% / .6)}
@media (min-width:700px){.m10b{gap:1.2px}.m10b b{width:3.6px;height:8px}.m10i,.m10i svg{width:11px;height:11px}}
@media (prefers-reduced-motion:reduce){.fc-shine{animation:none}}
/* ---- tabloid front page ---- */
.np{--ink:#121212;--red:#b0121a;--paper:#f2eee4;background:var(--paper);color:var(--ink);font-family:"Heebo",system-ui,sans-serif;padding:16px 16px 12px;position:relative;
  background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(0,0,0,.025)),repeating-linear-gradient(93deg,rgba(90,70,40,.025) 0 1px,transparent 1px 4px);box-shadow:0 1px 0 rgba(0,0,0,.08);max-width:760px;margin:0 auto;text-align:right;container-type:inline-size;box-sizing:border-box;width:100%;overflow-wrap:break-word}
.np-head{text-align:center;overflow:hidden}
.np-brand{line-height:1;border-bottom:1px solid var(--ink);padding-bottom:6px}.np-logo{font-weight:900;font-size:19px;letter-spacing:-.4px;display:inline-block}.np-logo b{color:var(--ink)}.np-logo i{color:var(--red);font-style:normal}
.np-brand small{display:block;font-size:11px;font-weight:500;color:#2a2a2a;margin-top:3px}
.np-title{font-family:"Karantina","Heebo",sans-serif;font-weight:700;font-size:clamp(48px,19vw,150px);font-size:clamp(48px,23cqi,150px);line-height:.8;white-space:nowrap;overflow:hidden;max-width:100%;letter-spacing:-.5px;margin:8px 0 6px}
.np-meta{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);padding:4px 0}
.np-meta span:first-child,.np-meta span:last-child{white-space:nowrap}.np-red{flex:1;height:3px;background:var(--red)}
.np-ribbon{display:table;margin:16px auto 8px;background:var(--red);color:#fff;font-weight:800;font-size:16px;line-height:1.2;padding:6px 18px;text-align:center}
.np-hl{font-family:"Karantina","Heebo",sans-serif;font-weight:700;font-size:clamp(46px,14vw,92px);font-size:clamp(46px,15cqi,92px);line-height:.9;text-align:center;margin:0;color:#0c0c0c;overflow-wrap:break-word;text-wrap:balance}
.np-sub{font-family:"Karantina","Heebo",sans-serif;font-weight:700;font-size:clamp(28px,8.4vw,44px);line-height:1;text-align:center;margin:8px 0 14px;text-wrap:balance}
.np-fig{margin:0}
.np-ph{position:relative;aspect-ratio:3/2;overflow:hidden;background:#2b2b2b}
.np-ph img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(1.02) contrast(1.03)}
.np-ph.np-noimg{background:linear-gradient(180deg,#30343c,#14161a)}.np-ph.np-noimg img{visibility:hidden}
.np-shirt{position:absolute;left:50%;bottom:31%;width:30%;transform:translateX(-50%);filter:drop-shadow(0 10px 16px rgba(0,0,0,.6))}

/* M3f: paper pop-up, stories, goals */
.papercard{background:#f3ecdc!important;padding:10px!important}
.paper.pp{box-shadow:none}.pp-hl{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:28px;line-height:1.1;margin:4px 0 6px;color:#1c1915}
.pp-fig{margin:8px 0;border:1px solid #c9bd9f}.pp-fig figcaption{font-size:11px;color:#5a534a;padding:3px 6px;background:#ece3cd}.pp-illu{width:100%;height:auto;display:block}
.pp-cols{columns:2 160px;column-gap:16px;column-rule:1px solid #cfc3a5;font-size:14px;line-height:1.55;color:#1c1915}.pp-cols .by{font-weight:700}
.pp-cols blockquote{margin:8px 0;padding:6px 10px;border-inline-start:3px solid #1c1915;font-style:italic;break-inside:avoid;font-size:15px}
.pp-foot{margin-top:8px;padding-top:6px;border-top:1px solid #cfc3a5;font-size:11px;color:#6b6252;text-align:center}
.papercard .btn.sec{color:#1c1915;background:#e6dcc3;box-shadow:inset 0 0 0 1px #c9bd9f}
.story{padding:10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);margin-top:8px}
.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.goals div{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
@media (max-width:420px){.goals{grid-template-columns:1fr}}
.slots{display:flex;flex-direction:column;gap:6px;margin-top:8px}.slot{display:flex;gap:6px;align-items:center}.slot-pick{flex:1;text-align:right;padding:8px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}.slot-pick small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot.cur .slot-pick{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.adbox{position:relative;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--abg);color:var(--afg);border:1px dashed rgba(255,255,255,.4);margin:6px 0;cursor:pointer}.adbox .adlbl{font-size:10px;opacity:.85;letter-spacing:.3px}.adbox b{font-weight:500}.adbox small{font-size:11px;opacity:.8}
.grp{margin:10px 2px 2px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
/* M3: staff + analyst */
.tl{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}.tl.big{color:#fff3c4}

.dpg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 6px}.dpg label{display:flex;flex-direction:column;gap:3px;color:var(--muted)}.dpg select{width:100%}

.staff .sic{font-size:22px;width:36px;height:36px;display:grid;place-items:center;background:var(--bg2);border-radius:10px;border:1px solid var(--line)}
.analyst{margin-top:10px;padding:12px;border-radius:12px;background:linear-gradient(180deg,#14223f,#0f1a31);border:1px solid var(--line2)}
.an-grid{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.an-sec{margin-top:8px}.an-sec ul{margin:2px 0 0;padding-inline-start:18px;font-size:13px;color:#d6def6}
.an-pl{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;font-size:13px;margin-top:3px}.an-pl .muted{grid-column:2/-1;margin-top:-3px}
.an-pl b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmrow{display:flex;gap:3px}.fm{font-style:normal;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700}.fm.w{background:var(--good);color:#04140b}.fm.d{background:#5b6785}.fm.l{background:var(--bad)}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}@media (max-width:460px){.plans{grid-template-columns:1fr}}
.plan{text-align:right;padding:8px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.plan b{font-weight:500;font-size:13.5px}.plan small{flex-basis:100%;color:var(--muted);font-size:11.5px;line-height:1.35}.plan .tag{font-size:10px}
.plan.on{border-color:var(--accent);background:linear-gradient(180deg,#123a33,#0f2b29);box-shadow:0 0 0 1px var(--accent) inset}
/* M2: medical, staff, commercial, dossier */
.ctabs{margin-bottom:2px}.dotb{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;padding:0 4px;margin-inline-start:2px}
.med,.ad{padding:10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
.med .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{font-size:10px;padding:1px 5px;border-radius:5px}
.mentop{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}@media (max-width:520px){.mentop{grid-template-columns:1fr}}
.ment{padding:10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.ment h4{margin:0;font-family:var(--display);font-weight:400;font-size:15px}.ment ul{margin:0;padding-inline-start:16px;color:#cfd8f3;line-height:1.5}
.arow2{display:flex;align-items:center;gap:8px;padding:3px 0}.arow2 .nm{flex:0 0 96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}.arow2 b{flex:0 0 32px;text-align:center;font-family:var(--display);font-weight:400}
.dos{margin-top:12px}.dos-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}@media (max-width:420px){.dos-top{grid-template-columns:1fr}}
.radar{width:100%;max-width:260px;height:auto;display:block;margin:0 auto}
.dos-bars{display:flex;flex-direction:column;gap:2px}.dos-bars .arow2 .nm{flex-basis:72px}
.devb i{background:linear-gradient(90deg,var(--info),var(--accent))}
.dos-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 4px}.dos-stats div{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:6px 4px;text-align:center;display:flex;flex-direction:column}
.dos-stats b{font-family:var(--display);font-weight:400;font-size:18px}.dos-stats span{font-size:10.5px;color:var(--muted)}
.card.in{background:var(--bg2);box-shadow:none}
.tblw{overflow-x:auto}.htbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;white-space:nowrap}.htbl th{color:var(--muted);font-weight:500;text-align:center;padding:3px 4px;border-bottom:1px solid var(--line)}.htbl td{text-align:center;padding:4px;border-bottom:1px solid rgba(255,255,255,.05);font-variant-numeric:tabular-nums}.htbl tr.cur td{color:var(--accent)}
/* match report */
.rep-head{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;margin-top:8px}
.rep-head .rt{text-align:center;border-bottom:3px solid var(--c,#888);padding-bottom:6px;min-width:0}
.rep-head .rt b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep-head .rs{font-family:var(--display);font-size:38px;line-height:1;text-align:center;display:flex;flex-direction:column;align-items:center}
.rep-head .rs .sc2{display:flex;gap:6px;align-items:center}
.rep-head .rs small{font-size:11px;color:var(--muted);font-family:var(--body)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rrow{display:grid;grid-template-columns:auto 1fr auto auto 30px;gap:5px;align-items:center;font-size:12px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.rrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .pos{font-size:9px;padding:1px 4px;border-radius:5px}
.rrow .rt{font-family:var(--display);font-size:14px;text-align:center;background:var(--bg2);border-radius:6px;padding:1px 0}
.rrow .rt.g{color:#0b1120;background:var(--good)}.rrow .rt.r{color:#fff;background:var(--bad)}
.rrow.motm{background:rgba(255,211,77,.08)}
.modal .card.wide{max-width:720px}
.fx.clickable{cursor:pointer}.fx.clickable:hover{background:rgba(255,255,255,.04)}
@media (max-width:420px){.rgrid{grid-template-columns:1fr}.rrow{font-size:11.5px}}
/* live layout */
.live-wrap{display:flex;flex-direction:column;gap:10px}
.live-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.live-side{background:linear-gradient(180deg,rgba(20,32,58,.92),rgba(12,20,38,.95));border:1px solid var(--line2);border-radius:14px;padding:10px;display:grid;grid-template-columns:96px 1fr;grid-template-areas:"hd hd" "mf b1" "mf b2" "mf mt" "ct ct";gap:8px;align-items:stretch}
.live-side>.row{grid-area:hd}
.live-side .minif{grid-area:mf}.live-side .minif svg{width:100%;height:auto;display:block}
.live-side #ctrlBtn{grid-area:b1}.live-side #subBtn{grid-area:b2}.live-side .livemt{grid-area:mt}.live-side .livectl{grid-area:ct}
.lbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);font-weight:500;font-size:14px;min-height:44px}
.lbtn.primary{background:linear-gradient(180deg,#d7ff5a,#a8e021);color:#0b1600;border-color:transparent;justify-content:center;font-weight:700}
.lbtn:disabled{opacity:.5}
.live-side .livemt button{padding:8px 2px}
.mfp{cursor:pointer}
.xistrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.xistrip::-webkit-scrollbar{display:none}
.xc{flex:0 0 auto;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto auto;gap:2px 6px;align-items:center;padding:6px 8px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);min-width:84px;position:relative;text-align:right}
.xc .pos{font-size:9px;padding:1px 4px;border-radius:5px}
.xc b{font-family:var(--display);font-weight:400;font-size:16px;justify-self:end}
.xc .nm{grid-column:1/-1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
.xc .en{grid-column:1/-1;height:4px;border-radius:2px;background:rgba(0,0,0,.45);overflow:hidden;display:block}
.xc .en u{display:block;height:100%;background:var(--good)}.xc .en.warn u{background:var(--warn)}.xc .en.bad u{background:var(--bad)}
.xc .yc{position:absolute;top:4px;left:4px;width:6px;height:9px;background:#ffd400;border-radius:1px}
.xc.bench{grid-template-columns:1fr;place-items:center;min-width:64px;color:var(--muted)}
.live-lower{display:flex;flex-direction:column;gap:10px;margin-top:10px}
@media (min-width:900px){.live-wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;align-items:start}.live-side .minif{max-width:150px}.live-side{grid-template-columns:1fr;grid-template-areas:"hd" "mf" "b1" "b2" "mt" "ct";position:sticky;top:8px}.live-side .minif{max-width:200px;justify-self:center;width:100%}.live-lower{display:grid;grid-template-columns:1fr 1fr}}
/* broadcast score bug */
.bug{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;background:linear-gradient(180deg,#131f3c,#0b1428);border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.bug .bt{display:flex;align-items:center;gap:8px;padding:8px 10px;min-width:0}
.bug .bt.a{justify-content:flex-end}
.bug .bt i{width:6px;align-self:stretch;border-radius:3px;background:linear-gradient(180deg,var(--c),var(--c2,var(--c)))}
.bug .bt b{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bug .bs{font-family:var(--display);font-size:30px;line-height:1;padding:4px 14px;display:flex;align-items:center;gap:6px;background:#0a1120;border-inline:1px solid var(--line)}
.bug .bc{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:10px;padding:4px 10px;background:#0a1120;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.bug .bc .clock{font-family:var(--display);font-size:16px;color:var(--accent)}
.livectl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.livectl .spd{display:flex;gap:4px;margin-inline-start:auto}
.livectl .spd button,.livectl .ic{padding:7px 9px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.livectl .spd button.on,.livectl .ic.on{background:linear-gradient(180deg,#1f3a63,#172c4e);color:var(--fg);border-color:var(--line2)}
.livemt{display:flex;gap:6px;align-items:center}
.livemt button{flex:1;padding:7px 4px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.livemt button.on{background:linear-gradient(180deg,#1f3a63,#172c4e);color:var(--fg);border-color:var(--line2)}
.ticker div.note{background:#2b2f4a;border-color:#8a8fd6;color:#dfe2ff}
input[type=number]{background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-variant-numeric:tabular-nums}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:#223052;color:var(--muted);white-space:nowrap}
.tag.bad{background:#4a2330;color:#ffb3bd}.tag.warn{background:#4a3a1c;color:#ffd79a}.tag.good{background:#1a4a36;color:#b5f3d0}.tag.info{background:#1c3a52;color:#b5dbff}
.tag.cap{background:var(--gold);color:#1b1300;font-weight:800;font-family:var(--display);padding:1px 7px}
.tag.live{background:var(--pink);color:#fff;font-weight:700;letter-spacing:.5px;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* buttons */
.btn{background:linear-gradient(180deg,#3cf7b7,#17c98a);color:#06201a;font-weight:700;padding:11px 16px;border-radius:11px;text-align:center;box-shadow:0 6px 18px rgba(39,240,166,.25),inset 0 -2px 0 rgba(0,0,0,.18);transition:transform .08s,filter .12s}
.btn:active{transform:translateY(1px);filter:brightness(.95)}
.btn.sec{background:linear-gradient(180deg,#1b2a4a,#142240);color:var(--fg);font-weight:500;box-shadow:inset 0 0 0 1px var(--line2)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px;box-shadow:none}
.btn.danger{background:linear-gradient(180deg,#6a2a36,#4a1d27);color:#ffd0d6;box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.big{font-size:18px;font-family:var(--display);font-weight:400;padding:14px}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{padding:6px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.tabs button.on{background:linear-gradient(180deg,#1f3a63,#172c4e);color:var(--fg);border-color:var(--line2)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{color:var(--muted);font-weight:500;font-size:12px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 4px;border-bottom:1px solid #1b2847;white-space:nowrap}
.tbl td.c,.tbl th.c{text-align:center}
.tbl tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.tbl tr.me td{background:rgba(39,240,166,.1)}
.tbl tr.top6 td:first-child{box-shadow:inset 3px 0 0 var(--good)}
.tbl tr.rel td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.tbl .pos-pill{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--bg2);font-family:var(--display);font-size:12px}
.form{display:inline-flex;gap:3px;vertical-align:middle}
.form i{width:9px;height:9px;border-radius:2px;display:inline-block;background:#3a4a6a}
.form i.W{background:var(--good)}.form i.D{background:#9aa7c7}.form i.L{background:var(--bad)}
.scroll{overflow-x:auto}

/* match */
.board{border-radius:var(--r);overflow:hidden;border:1px solid var(--line2);background:#0b1326;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.board .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
.board .tm{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 8px 10px;min-width:0;position:relative}
.board .tm::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--c1,#888)}
.board .tm b{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
.board .sc{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 12px;background:linear-gradient(180deg,#131f3c,#0c1527);min-width:118px}
.board .sc .big{font-family:var(--display);font-size:44px;line-height:1;display:flex;gap:8px;align-items:center}
.board .sc .clock{font-family:var(--display);font-size:18px;color:var(--accent);margin-top:2px}
.board .lbl{text-align:center;font-size:12px;color:var(--muted);padding:7px 10px;background:#0a1120;border-top:1px solid var(--line)}
.progress{height:4px;background:#1b2847;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .3s linear}
.ticker{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow-y:auto;font-size:13.5px;scroll-behavior:smooth}
.ticker div.latest{box-shadow:0 0 0 1px var(--accent) inset}
.ticker div{padding:6px 9px;border-radius:8px;background:var(--bg2);border-right:3px solid var(--line2)}
.ticker div.goal{background:#2d3d16;border-color:var(--gold);color:#fff3b0}
.ticker div.me.goal{background:#163d2c;border-color:var(--accent)}
.ticker div.card{background:#3f3418;border-color:var(--warn)}
.ticker div.inj{background:#3f1e26;border-color:var(--bad)}
.ticker div.sub{background:#15304a;border-color:var(--info)}
.mstat{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px;font-size:13px;margin-top:6px}
.mstat .bars{display:flex;gap:2px;height:8px}
.mstat .bars i{display:block;height:100%;border-radius:3px}
.mstat .bars i.h{background:var(--hc,#888)}.mstat .bars i.a{background:var(--ac,#aaa)}
.mstat .num{text-align:center;font-family:var(--display)}

.fx{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #1b2847;font-size:13.5px}
.fx .h{text-align:left}.fx .a{text-align:right}
.fx .s{font-family:var(--display);font-size:15px;min-width:52px;text-align:center;background:var(--bg2);border-radius:7px;padding:2px 6px;border:1px solid var(--line)}
.fx.me{color:var(--accent)}

/* start screen */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.teamcard{background:linear-gradient(180deg,#15223d,#0f1a30);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;overflow:hidden}
.teamcard::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.teamcard:hover,.teamcard:focus-visible{border-color:var(--accent);transform:translateY(-2px)}
.teamcard b{font-weight:500;font-size:14px}
.teamcard small{color:var(--muted);font-size:12px}
.teamcard .ov{font-family:var(--display);font-size:22px;color:var(--gold)}
.stars{color:var(--gold);letter-spacing:1px;font-size:12px}
.hero-top{text-align:center;padding-block:26px 8px;position:relative}
.hero-top h1{font-size:40px;color:#fff;text-shadow:0 0 30px rgba(39,240,166,.45)}
.hero-top h1 span{color:var(--accent)}
.hero-top p{color:var(--muted);max-width:40ch;margin:8px auto 0}
.hero-top::before{content:"";position:absolute;left:50%;top:-10px;width:420px;height:160px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(39,240,166,.22),transparent 65%);pointer-events:none}

.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:left}
.bar{height:6px;border-radius:3px;background:#1b2847;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.conf i{background:linear-gradient(90deg,var(--bad),var(--gold),var(--good))}

.offer{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:linear-gradient(180deg,#15223d,#0f1a30);display:flex;flex-direction:column;gap:6px}
.offer h3{color:var(--gold)}
.offer .sum{font-family:var(--display);font-size:24px}

.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#172c4e;border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1}

.contract{display:flex;flex-direction:column;gap:10px}
.sig{font-family:var(--display);font-size:22px;color:var(--gold);border-bottom:1px dashed var(--line2);padding-bottom:4px}

/* pitch */
.field{position:relative;width:100%;max-width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;
  background:repeating-linear-gradient(180deg,#2f7d42 0 12.5%,#2a7039 12.5% 25%);box-shadow:inset 0 0 80px rgba(0,0,0,.45),0 14px 40px rgba(0,0,0,.45);border:1px solid #3f9a55}
.field::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.12),transparent 55%);pointer-events:none}
.field svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tok{position:absolute;transform:translate(-50%,-50%);width:64px;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;transition:transform .12s,filter .12s}
.tok .capb{position:absolute;left:6px;top:4px;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#1b1300;font-family:var(--display);font-size:12px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.5);border:1px solid #fff3}
.field.mini .tok .capb{width:13px;height:13px;font-size:9px;left:2px;top:2px}
.tok .fitb{width:44px;height:3px;border-radius:2px;background:rgba(0,0,0,.45);margin-top:2px;position:relative;overflow:hidden}
.tok .fitb::after{content:"";position:absolute;inset:0;width:var(--w,100%);background:var(--good)}
.tok .fitb.warn::after{background:var(--warn)}.tok .fitb.bad::after{background:var(--bad)}
.field.mini .tok .fitb{width:30px;height:2px}
.tok .nm{font-size:11.5px;line-height:1.15;font-weight:700;color:#fff;background:rgba(6,12,24,.86);padding:2px 7px;border-radius:999px;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tok.sel .nm{background:var(--gold);color:#1b1300}
.tok.bad .nm{background:#7a2a36}
.tok.empty .nm{background:rgba(255,255,255,.18);font-weight:500}
.tok .pc{filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.tok.sel{transform:translate(-50%,-50%) scale(1.12);z-index:2}
.tok.sel .pc{filter:drop-shadow(0 0 10px var(--gold))}
.tok.bad .pc{filter:grayscale(.8) drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.tok.oop .pc{filter:drop-shadow(0 0 8px var(--warn))}
.tok.empty .pc{opacity:.35}
.tok:focus-visible{outline:2px solid var(--accent)}
.field.mini .tok{width:46px}.field.mini .tok .nm{font-size:9px;padding:1px 5px;max-width:56px}

.pc{display:block;width:100%;height:auto}
.pc text{font-family:var(--display)}

.pc-big{width:140px;margin:0 auto}

.mt{display:flex;gap:6px}

.attrs{display:flex;flex-direction:column;gap:6px;margin-top:12px}

.attrs .arow .anum{flex:0 0 28px;font-family:var(--display);font-size:15px;font-weight:700;text-align:center}
.attrs .arow .abar{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.attrs .arow .abar i{display:block;height:100%;border-radius:4px;transition:width .3s}

const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const NIS=n=>{const s=n<0?'-':'';n=Math.abs(n);return s+'₪'+(n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e3?(n/1e3).toFixed(0)+'K':n.toFixed(0))};

/* ====================== PLAYER MODEL ====================== */
function ratingFromValue(v,age){let o=66+5*Math.log2(Math.max(v,.05));if(age!=null&&age<21)o+=2;return clamp(Math.round(o),46,86)}
function potentialFor(ovr,age){if(age<=20)return clamp(ovr+ri(8,16),ovr,92);if(age<=23)return clamp(ovr+ri(3,9),ovr,90);if(age<=26)return clamp(ovr+ri(0,3),ovr,88);return ovr}
function playerValue(p){const f=p.age<23?1.25:p.age<29?1:p.age<32?.75:p.age<34?.5:.3;return Math.round(4e6*Math.pow(2,(p.ovr-66)/5)*f/10000)*10000}
function playerWage(p){return Math.round(9000*Math.pow(2,(p.ovr-58)/6)/500)*500}
function finalize(p){if(p.id&&!p.pers)assignPers(p);p.value=playerValue(p);if(p.contract!=null&&p.contract<=1)p.value=Math.round(p.value*.65/1e4)*1e4;if(p.wage==null)p.wage=playerWage(p);return p}
function initialContract(age){return age<=23?ri(2,4):age<=29?ri(1,3):ri(1,2)}
function contractYear(p){return 2026+G.season-1+(p.contract||0)}
function contractDemand(p){const base=playerWage(p);const mult=(1+(p.age<=25?.35:p.age<=30?.2:.05)+(p.form>1?.1:0)+(p.ovr>=p.pot-2?0:.05)+(p.hype||0)*.08)*(p.pers?persWageMult(p):1);return {wage:Math.round(base*mult/500)*500,years:p.age<=25?3:p.age<=30?2:1,bonus:Math.round(base*mult*8/1e4)*1e4}}
function splitName(he){const parts=he.trim().split(/\s+/);if(parts.length===1)return[parts[0],''];return[parts[0],parts.slice(1).join(' ')]}
function fromRaw(r,median){
  const age=r.age??ri(19,29);
  let ovr=r.value_m!=null?ratingFromValue(r.value_m,age):clamp(Math.round(median-3+gauss()*3),46,80);
  if(r.ft_only)ovr=clamp(ovr-3,44,80);
  const [first,last]=splitName(r.he);
  const nat=r.nat||'Israel';
  return finalize({id:uid++,first,last,pos:r.pos,age,nat:NAT_HE[nat]||nat,foreign:nat!=='Israel',ovr,pot:potentialFor(ovr,age),form:0,yellow:0,inj:0,susp:0,goals:0,apps:0,contract:initialContract(age),morale:ri(58,74),fit:100,real:!r.unmatched&&!r.ft_only});
}
function makePlayer(pos,base,youth,forceForeign){
  const foreign=forceForeign??(!youth&&Math.random()<.22);
  const nm=foreign?pick(FOREIGN):[pick(FIRST),pick(LAST)];
  const age=youth?ri(15,18):ri(18,34);
  const ovr=clamp(Math.round(base+gauss()*5+(age<21?-6:age>32?-3:0)),youth?32:44,88);
  const pot=youth?clamp(Math.round(ovr+rnd(14,40)),50,92):potentialFor(ovr,age);
  return finalize({id:uid++,first:nm[0],last:nm[1],pos,age,nat:foreign?'זר':'ישראל',foreign,ovr,pot,form:0,yellow:0,inj:0,susp:0,goals:0,apps:0,contract:youth?3:initialContract(age),morale:ri(58,74),fit:100,real:false});
}
function makeSquad(base){const sq=[];const plan={GK:3,DF:8,MF:8,FW:5};for(const pos of POS)for(let i=0;i<plan[pos];i++)sq.push(makePlayer(pos,base));return sq}
function makeYouth(n){const out=[];for(let i=0;i<n;i++)out.push(makePlayer(pick(['GK','DF','DF','MF','MF','FW']),45,true));return out}

function xiPlayers(M,c){return M.xi[c.id].map(e=>({p:c.players.find(x=>x.id===e.pid),e})).filter(x=>x.p)}
function slotPenalty(p,slot){if(!slot||slot===p.pos)return 0;if(p.pos2&&slot===p.pos2)return 1;if(slot==='GK'||p.pos==='GK')return 18;if((slot==='DF'&&p.pos==='FW')||(slot==='FW'&&p.pos==='DF'))return 7;return 4}
function xiStrength(M,c){const xs=xiPlayers(M,c);if(!xs.length)return 35;const s=xs.reduce((t,{p,e})=>t+effOvr(p)-slotPenalty(p,e.slot)-Math.max(0,M.m-e.since-60)*.04,0)/xs.length;const capP=c.captain&&xs.find(x=>x.p.id===c.captain);const cap=capP?(capP.p.pers==='leader'?1.2:.6):0;const boost=(M.boost&&M.boost[c.id])||0;let calm=0;if(c.id===G.me){calm+=chemBonus(c,M)}if(c.id===G.me&&mentalActive()){if(M.bigC==null){try{M.bigC=isBigMatch(M)?1:0}catch(e){M.bigC=0}}calm=M.bigC*.35}return s+cap+boost+calm-(11-xs.length)*5}
function mentalityAdj(c,M){const m=M?liveMentality(M,c):(c&&c.mentality);return m==='att'?[.14,.14]:m==='def'?[-.1,-.15]:[0,0]}
function expGoals(sh,sa,neutral,h,a,M){const d=sh-sa;const ha=neutral?0:.22;const mh=mentalityAdj(h,M),ma=mentalityAdj(a,M);const t=M&&M.tadj||{dh:0,da:0};return [Math.max(.2,1.3+d*.06+ha+mh[0]+ma[1]+t.dh),Math.max(.18,1.3-d*.06-.04+ma[0]+mh[1]+t.da)]}
function scorerFrom(M,c){const xs=xiPlayers(M,c);if(!xs.length)return null;const mk=M.plan&&M.plan.kind==='mark'&&M.plan.target?M.plan.target:null;const w=xs.map(({p})=>{const r=roleOf(p);let b=p.pos==='FW'?6:p.pos==='MF'?3:p.pos==='DF'?1:.05;if(r==='poach')b*=1.5;if(r==='target')b*=1.15;if(r==='false9')b*=.75;if(r==='winger')b*=1.3;if(r==='b2b')b*=1.2;if(r==='anchor')b*=.5;if(r==='wingback')b*=1.4;if(mk&&p.id===mk)b*=1-.5*(M.plan.mult||1);return b});let r=Math.random()*w.reduce((x,y)=>x+y,0);for(let i=0;i<xs.length;i++){r-=w[i];if(r<=0)return xs[i].p}return xs[0].p}
function penTaker(M,c){const xs=xiPlayers(M,c);if(!xs.length)return null;const fw=xs.filter(x=>x.p.pos==='FW').sort((a,b)=>b.p.ovr-a.p.ovr)[0]||xs.filter(x=>x.p.pos==='MF').sort((a,b)=>b.p.ovr-a.p.ovr)[0]||xs[0];return fw.p}
function fm(m){return '\u2066'+m+"'\u2069"}
function injuryWeeks(c){const r=Math.random();let w=r<.4?1:r<.7?ri(2,3):r<.9?ri(4,8):ri(9,16);w=Math.max(1,Math.round(w*(1-.08*((c.training||1)-1))*(c.id===G.me?1-.06*staffD('phys'):1)));return w}
const INJ_TYPES=[['שריר ירך אחורי',1,3],['קרסול',1,4],['ברך',3,12],['מפשעה',2,4],['שריר התאומים',1,3],['כתף',2,6],['גב תחתון',1,3],['שבר במסרק כף הרגל',6,10],['רצועה צולבת',16,16],['זעזוע מוח',1,2],['מתיחה',1,2]];

function shotSpot(kind){if(kind==='pen')return {x:94,y:34};const d=kind==='goal'?rnd(5,17):kind==='save'?rnd(7,22):kind==='post'?rnd(7,20):rnd(9,28);const ang=rnd(-1.1,1.1);return {x:+clamp(105-d*Math.cos(ang),55,104).toFixed(1),y:+clamp(34+d*Math.sin(ang),3,65).toFixed(1)}}

function assistFrom(M,c,scorer){const xs=xiPlayers(M,c).filter(x=>x.p.id!==scorer.id);if(!xs.length||Math.random()<.22)return null;const w=xs.map(({p})=>{const r=roleOf(p);let b=p.pos==='MF'?4:p.pos==='FW'?3:p.pos==='DF'?1:.1;if(r==='play'||r==='winger'||r==='wingback')b*=1.6;if(r==='false9')b*=1.4;return b});let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<xs.length;i++){r-=w[i];if(r<=0)return xs[i].p}return xs[0].p}
function pstat(M,cid,pid){M.ps=M.ps||{};const t=M.ps[cid]||(M.ps[cid]={});return t[pid]||(t[pid]={sh:0,sot:0,g:0,a:0,sv:0,ps:0,min:0,y:0,red:0,xg:0})}
function shotEvent(M,c,opp,kind,shooter){const spot=shotSpot(kind);const ev={m:M.m,t:'shot',sub:kind,team:c.id,pid:shooter?shooter.id:null,name:shooter?fullName(shooter):'',x:spot.x,y:spot.y,xg:xgOf(spot.x,spot.y),path:buildPath(spot,kind)};

function goalEvent(M,c,p,kind){const spot=shotSpot(kind==='pen'?'pen':'goal');const ev={m:M.m,t:kind,team:c.id,pid:p.id,name:fullName(p),x:spot.x,y:spot.y,xg:kind==='pen'?.76:xgOf(spot.x,spot.y),path:buildPath(spot,kind),corner:M.ev.some(e=>e.t==='corner'&&e.m===M.m&&e.team===c.id)};

function markOut(M,c,e){if(M.mins&&e)M.mins[c.id][e.pid]=Math.max(0,M.m-e.since)}
/* per-player minutes / passes / clean sheets / ratings, derived from the recorded event stream */

    const yel=new Set(M.ev.filter(e=>e.t==='yellow'&&e.team===c.id).map(e=>e.pid)),red=new Set(M.ev.filter(e=>e.t==='red'&&e.team===c.id).map(e=>e.pid));

function stepMinute(M){

    else if(r2<(lh+la)*.0025){const p=penTaker(M,a);if(p){M.shots[a.id]++;if(Math.random()<.76){M.ga++;M.sot[a.id]++;M.ev.push(goalEvent(M,a,p,'pen'))}else{const s=pstat(M,a.id,p.id);s.sh++;M.ev.push({m:M.m,t:'penmiss',team:a.id,pid:p.id,name:fullName(p),x:94,y:34,xg:.76,path:buildPath({x:94,y:34},Math.random()<.5?'save':'off')})}}}
    else if(r2<(lh+la)*.0025+.0006){const og=Math.random()<.5?h:a;const other=og===h?a:h;const ds=xiPlayers(M,og).filter(x=>x.p.pos==='DF'||x.p.pos==='GK');const x=ds.length?pick(ds):null;if(x){if(og===h)M.ga++;else M.gh++;M.ev.push({m:M.m,t:'own',team:other.id,ogteam:og.id,pid:x.p.id,name:fullName(x.p),x:rnd(96,103),y:rnd(26,42),xg:.1})}}}

function bench(M,c){const inXI=new Set(M.xi[c.id].map(e=>e.pid));const used=new Set(M.used[c.id]);return available(c).filter(p=>!inXI.has(p.id)&&!used.has(p.id))}
function autoSub(M,c,pos){

function settle(M){if(G&&(M.h===G.me||M.a===G.me)){const mc=me();if(mc)mc.prepLeft=0}

    if(e.t==='red'){const p=club(e.team).players.find(x=>x.id===e.pid);if(p)p.susp=Math.max(p.susp,ctx.kind==='league'?2:1)}}

  }

/* ---- attendance & fans ---- */
function attendanceFor(h,a,kind,stage){
  if(!h.league||h.pseudo)return 0;
  const pos=standings().findIndex(x=>x.id===h.id);
  let fill=.18+(h.fans??baseFans(h))/100*.62;
  if(a.tier===1||(a.prestige&&a.prestige<=4))fill+=.12;
  if(isDerby(h.id,a.id))fill+=.1;
  if(kind==='cup')fill+=stage==='R16'?-.06:stage==='QF'?.04:.1;if(kind==='toto')fill-=.15;
  if(kind==='euro')fill+=['Q2','Q3','PO'].includes(stage)?.12:stage==='LP'?.22:.32;
  if(pos>=0&&pos<3)fill+=.05;if(pos>=11)fill-=.04;
  fill+=rnd(-.05,.05);
  const base=baseTicket(h);const price=h.ticket||base;fill*=clamp(1-(price-base)/base*.55,.3,1.25);
  return Math.round(clamp(fill,.1,1)*effectiveCap(h));
}
function fansUpdate(c,gf,ga,opp,kind,stage,home){

  if(kind==='euro')d+=gf>ga?2:1;if(kind==='cup'&&gf>ga&&['QF','SF','F'].includes(stage))d+=1;if(gf-ga>=3)d+=1;

}
function fansDecay(){for(const c of G.clubs){const b=baseFans(c);const f=c.fans??b;c.fans=f>b?Math.max(b,f-.5):Math.min(b,f+.5)}}

/* ---- training & recovery ---- */
function trainCfg(c){return {focus:c.focus||'bal',intensity:c.intensity||'mid'}}
function devFactor(c,p){if(c._fx){const x=c._fx;const fwd=p.pos==='FW'||p.pos==='MF';return x.dev*(fwd?1+.12*x.att-.05*x.def:1+.12*x.def-.05*x.att)}const {focus,intensity}=trainCfg(c);let f=1;
  if(focus==='att')f*=(p.pos==='FW'||p.pos==='MF')?1.4:.7;else if(focus==='def')f*=(p.pos==='DF'||p.pos==='GK')?1.4:.7;else if(focus==='youth')f*=.8;else if(focus==='fit'||focus==='rec')f*=.8;
  if(intensity==='high')f*=1.25;else if(intensity==='low')f*=.8;return f}
function recoverWeekly(c){const {focus,intensity}=trainCfg(c);const base=c._fx?22+3*((c.training||1)-1)+2*staffD('fit')+c._fx.rec+((c.cond??60)-60)/10:22+3*((c.training||1)-1)+(c.id===G.me?2*staffD('fit'):0)+(intensity==='low'?5:intensity==='high'?-4:0)+(focus==='rec'?6:0);
  for(const p of c.players){if(p.inj){if(p.inj<=1)p.fit=Math.max(p.fit??100,70);continue}const f=p.fit??100;p.fit=clamp(f+base+(100-f)*.15,0,100)}}

  for(const p of c.players){if(p.inj||p.fit==null)continue;const tired=p.fit<60?1.8:1;if(Math.random()<prob*tired*(p.fragile>0?1.5:1)){setInjury(p,ri(1,3));if(c.id===G.me)news(`${fullName(p)} נפצע באימון: ${p.injT} (${p.inj} שבועות).`)}}}
function matchFatigue(M){for(const id of [M.h,M.a]){const c=club(id);if(!c||c.pseudo)continue;const cost=((c.focus==='fit')?.85:1)*(M.tadj?(id===M.h?M.tadj.fatH:M.tadj.fatA):1);
  for(const e of M.xi[id]){const p=c.players.find(x=>x.id===e.pid);if(p)p.fit=clamp((p.fit??100)-Math.round((90-e.since)/90*28*cost),0,100)}

function moraleAfterMatch(M,c,gf,ga){

  const top11=c.players.slice().sort(byOvr).slice(0,11).map(p=>p.id);
  for(const p of c.players){let d=0;if(played.has(p.id))d=gf>ga?3:gf===ga?1:(mentalActive()?-1:-2);else if(!p.inj&&!p.susp&&(p.fit??100)>=80)d=top11.includes(p.id)?-2:-1;
    p.morale=clamp((p.morale??65)+d*persMoraleMult(p),10,100)}
  const leaders=c.players.filter(p=>p.pers==='leader'&&played.has(p.id)).length;if(leaders&&gf<ga)c.players.forEach(p=>p.morale=clamp(p.morale+1,10,100));

function manOfMatch(M,h,a){

  function draw(){

    }else if(nn.stage==='review'){const o=nn.offer,po=nn.poffer;const cap=ensureWageCap();const bill=wageBill(c);const after=bill+po.wage;const up=o.inst===1?o.fee:Math.round(o.fee/o.inst);const agent=Math.round(o.fee*.05/1e4)*1e4;const total=o.fee+agent+po.bonus+po.wage*46*po.years;

/* ====================== MANAGER LAYER: personalities, player talks, press conferences, board, job offers, team talks ====================== */
const PERS={
 professional:{he:'מקצוען',icon:'🎯',desc:'יציב, לא מתרגש מכלום. עובד קשה גם כשהוא על הספסל.'},
 ambitious:{he:'שאפתן',icon:'🚀',desc:'רוצה לשחק באירופה ובמועדון גדול. מאבד סבלנות בלי הישגים.'},
 loyal:{he:'נאמן',icon:'🛡️',desc:'קשור למועדון ולאוהדים. קשה להוציא אותו ודורש פחות.'},
 mercenary:{he:'שכיר חרב',icon:'💰',desc:'הכסף מדבר. יבוא לכל מקום שישלם, ויעזוב כשישלמו יותר.'},
 temperamental:{he:'חם מזג',icon:'🔥',desc:'מורל שמתנדנד, מגיב קשה לביקורת, אבל יכול להדליק את הקבוצה.'},

};
function assignPers(p){if(p.pers)return p;const h=(p.id*40503+ (p.age||25)*7)>>>0;const r=h%100;
  p.pers=r<28?'professional':r<46?'ambitious':r<60?'loyal':r<74?'mercenary':r<90?'temperamental':'leader';
  if(p.pers==='leader'&&(p.age||25)<26)p.pers='professional';if(p.pers==='loyal'&&p.foreign&&Math.random()<.5)p.pers='professional';return p}
function persMoraleMult(p){return p.pers==='temperamental'?1.5:p.pers==='professional'?.6:1}
function persWageMult(p){return p.pers==='mercenary'?1.2:p.pers==='loyal'?.9:p.pers==='ambitious'?1.08:1}
const OWNERS={investor:{he:'משקיע',desc:'מזרים כסף כשמבקשים, אבל מצפה לתוצאות מיד.',inject:1.6,fire:14},
 patient:{he:'סבלני',desc:'נותן זמן לבנות. לא יזרים הון, אבל גם לא ימהר לפטר.',inject:.9,fire:8},
 impatient:{he:'חסר סבלנות',desc:'שלושה הפסדים והוא כבר מחפש מחליף.',inject:1.1,fire:18},
 frugal:{he:'חסכן',desc:'כל שקל נספר. תקציב קטן, יעדים צנועים.',inject:.5,fire:11}};
function ownerOf(c){if(!c.owner){const h=[...c.id].reduce((t,ch)=>t+ch.charCodeAt(0),0);c.owner=['investor','patient','impatient','frugal'][h%4]}return OWNERS[c.owner]}
function fireThreshold(){return ownerOf(me()).fire}

/* ---- manager trust & promises ---- */
function trust(){return G.manager.trust??60}
function addTrust(d){G.manager.trust=clamp(trust()+d,10,100)}
function checkPromises(){const c=me();for(const p of c.players){if(!p.promise)continue;p.promise.left--;
  const started=c.lineup&&c.lineup.includes(p.id);if(started)p.promise.starts++;
  if(p.promise.left<=0){const ok=p.promise.starts>=p.promise.need;if(ok){p.morale=clamp(p.morale+6,10,100);addTrust(3);news(`${fullName(p)}: ההבטחה לדקות משחק קוימה, המורל עלה.`)}else{p.morale=clamp(p.morale-14*persMoraleMult(p),10,100);addTrust(-6);news(`${fullName(p)} מרגיש שהבטחת לו דקות ולא קיימת. האמון בך נפגע.`);if(p.pers==='temperamental')paper('מועדון',`${fullName(p)} זועם: "הבטיחו לי ולא קיימו"`,'השחקן תוקף את המנג\'ר בראיון',`בסביבת ${fullName(p)} אומרים שהוא מרגיש מרומה אחרי שהובטחו לו דקות משחק. במועדון מנסים להרגיע.`)}p.promise=null}}}

/* ---- player talks ---- */
const TALKS=[
 {id:'promise',t:'"אתה חשוב לי. תקבל דקות בשבועות הקרובים."',hint:'מרים מורל מיד, אבל אם לא ישחק 3 מתוך 6 המשחקים הבאים, הוא יפגע והאמון בך יירד.'},
 {id:'reassure',t:'"תירגע, העבודה באימונים תדבר."',hint:'שיחה שקטה. מקצוענים אוהבים, חמי מזג פחות.'},
 {id:'push',t:'"אני מצפה ממך להרבה יותר."',hint:'ביקורת. עלולה להדליק שחקן שנרדם או לפוצץ חם מזג.'},
 {id:'list',t:'"אתה ברשימת ההעברות. נמצא לך מועדון."',hint:'הצעות יגיעו מהר יותר. המורל יורד אבל הוא מפסיק להתלונן.'},
 {id:'unlist',t:'"הורדתי אותך מרשימת ההעברות. אני סומך עליך."',hint:'מחזיר שחקן לסגל ברוח טובה.'},
];
function talkOptions(p){return TALKS.filter(t=>t.id==='unlist'?p.listed:t.id==='list'?!p.listed:true)}
function doTalk(pid,kind){const c=me();const p=c.players.find(x=>x.id===pid);if(!p)return;if(p.talkWk!=null&&p.talkS===G.season&&G.wk-p.talkWk<3)return toast('דיברת איתו לאחרונה. תן לזה לשקוע.');
  p.talkWk=G.wk;p.talkS=G.season;const tr=trust();let msg='';const m=persMoraleMult(p);
  if(kind==='promise'){const d=Math.round((8+(tr-60)/8)*(p.pers==='ambitious'||p.pers==='mercenary'?1.3:1));p.morale=clamp(p.morale+d,10,100);p.promise={left:6,need:3,starts:0};p.unhappy=false;msg=p.pers==='temperamental'&&tr<50?'"שמעתי את זה כבר. נראה."':'"זה מה שרציתי לשמוע."'}
  else if(kind==='reassure'){const d=p.pers==='professional'?8:p.pers==='temperamental'?-3:4;p.morale=clamp(p.morale+d,10,100);msg=d>0?'"בסדר, אני ממשיך לעבוד."':'"קל להגיד כשלא אתה על הספסל."'}
  else if(kind==='push'){if(p.pers==='temperamental'){p.morale=clamp(p.morale-8,10,100);msg='"אתה לא יודע מה אתה מדבר!"';if(Math.random()<.35)paper('מועדון',`עימות בין ${G.manager.name} ל${fullName(p)}`,'צעקות באימון, השחקן עזב את המגרש מוקדם',`לפי עדויות, השיחה בין המנג'ר לשחקן התלהטה. ${pick(['בהנהלה דורשים להרגיע את הרוחות.','הסוכן של השחקן כבר בדק אפשרויות.','חברים לקבוצה ניסו להפריד.'])}`)}
    else if(p.pers==='professional'){p.morale=clamp(p.morale+2,10,100);p.form=clamp(p.form+.6,-4,4);msg='"צודק. אני אתקן."'}
    else{p.morale=clamp(p.morale-3,10,100);p.form=clamp(p.form+.4,-4,4);msg='"אני אוכיח לך."'}}
  else if(kind==='list'){p.listed=true;p.unhappy=false;p.morale=clamp(p.morale-(p.pers==='loyal'?10:4),10,100);msg=p.pers==='loyal'?'"אחרי כל מה שנתתי למועדון..."':'"לפחות עכשיו אני יודע איפה אני עומד."'}
  else if(kind==='unlist'){p.listed=false;p.morale=clamp(p.morale+6,10,100);msg='"תודה על האמון."'}
  if(p.pers==='leader'&&kind!=='push'){c.players.forEach(x=>{if(x!==p)x.morale=clamp(x.morale+1,10,100)})}
  closeModal();toast(`${p.last||p.first}: ${msg}`);save();render()}
function talkModal(pid){const c=me();const p=c.players.find(x=>x.id===pid);if(!p)return;const P=PERS[p.pers||'professional'];
  openModal(`<h3 class="sec">שיחה עם ${esc(fullName(p))}</h3><div class="small muted" style="margin:4px 0 8px">${P.icon} ${P.he}: ${esc(P.desc)} · מורל ${moraleWord(p.morale)} (${Math.round(p.morale)}) · האמון שלך בחדר ההלבשה: ${trust()}/100</div>

  <div class="actions" style="margin-top:10px"><button class="btn sec" data-close>לא עכשיו</button></div>`,e=>{const b=e.target.closest('[data-talk]');if(b)doTalk(pid,b.dataset.talk)})}

/* ---- press conferences ---- */
const REPORTERS=['יואב רוזנברג, "הספורט היומי"','מירב שחר, רדיו 99 ספורט','אבי דנינו, ערוץ הכדורגל','נועה בר-לב, אתר הדרבי','שמעון אוחיון, "זמן כדורגל"'];

function isBigMatch(M){const h=club(M.h),a=club(M.a);const opp=h.id===G.me?a:h;const ev=currentEvent()||{};

function teamMorale(d,filter){me().players.forEach(p=>{if(!filter||filter(p))p.morale=clamp(p.morale+d*persMoraleMult(p),10,100)})}
function pressQuestionsPre(M){
  const c=me();const h=club(M.h),a=club(M.a);const opp=h.id===G.me?a:h;const qs=[];const derby=derbyLabel(h.id,a.id);const stronger=strength(c)>strength(opp)+3;

    {t:'הוא השחקן הטוב בליגה.',fx:()=>{motm.morale=clamp(motm.morale+6,10,100);teamMorale(-1,p=>p!==motm&&p.pos===motm.pos);motm.hype=(motm.hype||0)+1;quote(fullName(motm)+' הטוב בליגה')()},r:'הוא ירצה חוזה חדש. המתחרים לעמדה קינאו.'},

  if(red)qs.push({q:`ההרחקה של ${red.name} הכריעה?`,a:[

function runPress(kind,M,done){
  const mode=pressMode();if(mode==='off'||M.ctx.kind==='friendly')return done();
  const big=isBigMatch(M);if(mode==='big'&&!big&&Math.random()>.3)return done();
  const qs=shuffle(kind==='pre'?pressQuestionsPre(M):pressQuestionsPost(M)).slice(0,big?2:1);if(!qs.length)return done();
  let i=0;const d=openModal('',e=>{const b=e.target.closest('[data-ans]');if(b){const q=qs[i];const ans=q.a[+b.dataset.ans];ans.fx();d.querySelector('.card').innerHTML=`<div class="press"><span class="tag info">${kind==='pre'?'מסיבת עיתונאים · לפני המשחק':'מסיבת עיתונאים · אחרי המשחק'}</span><div class="press-q">${esc(q.q)}</div><div class="press-you">"${esc(ans.t)}"</div><div class="small" style="margin-top:8px;color:var(--accent)">${esc(ans.r)}</div><div class="actions" style="margin-top:12px"><button class="btn" id="pressNext">${i<qs.length-1?'השאלה הבאה':'סיום'}</button></div></div>`;save();return}
    if(e.target.closest('#pressNext')){i++;if(i>=qs.length){closeModal();done()}else draw()}});d.dataset.lock='1';
  function draw(){const q=qs[i];d.querySelector('.card').innerHTML=`<div class="press"><div class="row between"><span class="tag info">${kind==='pre'?'מסיבת עיתונאים · לפני המשחק':'מסיבת עיתונאים · אחרי המשחק'}</span><span class="muted tiny">${i+1}/${qs.length}</span></div><div class="muted tiny" style="margin-top:8px">${esc(pick(REPORTERS))}:</div><div class="press-q">${esc(q.q)}</div><div class="list" style="margin-top:10px">${q.a.map((a,k)=>`<button class="pl" style="display:block;text-align:right;cursor:pointer" data-ans="${k}"><b>"${esc(a.t)}"</b></button>`).join('')}</div></div>`}
  draw();
}

/* ---- half-time team talk ---- */
function halfTimeTalk(M,tick){const h=club(M.h),a=club(M.a);const mineHome=h.id===G.me;const gf=mineHome?M.gh:M.ga,ga=mineHome?M.ga:M.gh;
  const box=document.createElement('div');box.className='tt';box.innerHTML=`<div class="muted tiny">שיחת מחצית בחדר ההלבשה:</div><div class="row wrap" style="gap:6px;margin-top:4px"><button class="btn sm sec" data-ht="praise">כל הכבוד, תמשיכו ככה</button><button class="btn sm sec" data-ht="angry">אני מצפה להרבה יותר!</button><button class="btn sm sec" data-ht="calm">תירגעו, תשחקו את המשחק שלכם</button></div>`;
  tick.appendChild(box);tick.scrollTop=tick.scrollHeight;
  box.onclick=e=>{const b=e.target.closest("[data-ht]");if(!b)return;e.stopPropagation();const k=b.dataset.ht;let v=0,txt='';const lead=gf-ga;const hot=me().players.filter(p=>me().lineup.includes(p.id)&&p.pers==='temperamental').length;
    if(k==='praise'){v=lead>0?.4:lead===0?.1:-.3;txt=lead>0?'השחקנים יצאו בביטחון.':lead===0?'שביעות רצון מוקדמת.':'הקבוצה יצאה רגועה מדי.'}
    else if(k==='angry'){if(lead<=0){const backfire=Math.random()<.2+hot*.08;v=backfire?-.4:.7;txt=backfire?'כמה שחקנים נסגרו. חדר ההלבשה שקט מדי.':'הקבוצה יצאה עם אש בעיניים!'}else{v=-.5;txt='השחקנים לא הבינו את הכעס.'}}
    else{v=.2+(M.ev.some(e=>e.m>=40&&e.m<=45&&e.t==='goal'&&e.team!==G.me)?.3:0);txt='הראש חזר למקום.'}
    M.boost=M.boost||{};M.boost[G.me]=(M.boost[G.me]||0)+v;box.innerHTML=`<div class="tiny" style="color:var(--accent)">${txt}</div>`;}
}

/* ---- board meeting & ultimatums ---- */
function boardMeetingOptions(){const c=me();const O=ownerOf(c);const base=Math.round(clamp(c.squadValue*.12,2e6,20e6)/1e5)*1e5;
  return [
   {id:'money',t:'"אני צריך תקציב העברות גדול יותר."',d:`הבעלים ${O.he} יזרים כ-${NIS(Math.round(base*O.inject/1e5)*1e5)}, אבל היעד יעלה בדרגה.`,fx:()=>{const inj=Math.round(base*O.inject/1e5)*1e5;c.money+=inj;addLog('הזרמת בעלים',inj);G.board.expectRank=Math.max(1,G.board.expectRank-(G.board.expectRank>6?3:1));G.board.expectText=expectTextFor(G.board.expectRank);return `הבעלים הזרים ${NIS(inj)}. היעד החדש: ${G.board.expectText}.`}},
   {id:'patience',t:'"זו עונת בנייה. תנו לי זמן."',d:'היעד יירד בדרגה ואמון ההנהלה יעלה, אבל 10% מהתקציב יוקפאו.',fx:()=>{const cut=Math.round(c.money*.1);c.money-=cut;addLog('הקפאת תקציב לפי בקשת המנג\'ר',-cut);G.board.expectRank=Math.min(12,G.board.expectRank+(G.board.expectRank<6?3:1));G.board.expectText=expectTextFor(G.board.expectRank);G.board.conf=clamp(G.board.conf+5,0,100);return `ההנהלה הסכימה. היעד החדש: ${G.board.expectText}.`}},
   {id:'infra',t:'"תשקיעו בתשתיות, לא בשחקנים."',d:'שדרוג חינם של מגרש האימונים או האקדמיה (הנמוך מביניהם).',fx:()=>{if((c.training||1)<=(c.academy||1)&&c.training<5){c.training++;return `מגרש האימונים שודרג לרמה ${c.training} על חשבון הבעלים.`}else if(c.academy<5){c.academy++;return `האקדמיה שודרגה לרמה ${c.academy} על חשבון הבעלים.`}c.money+=2e6;return 'הכל כבר ברמה המקסימלית, קיבלת ₪2M במקום.'}},
   {id:'none',t:'"אנחנו מסודרים. נעבוד עם מה שיש."',d:'ההנהלה מעריכה צניעות: אמון +3.',fx:()=>{G.board.conf=clamp(G.board.conf+3,0,100);return 'ההנהלה רשמה לעצמה שאתה איש של ביצועים.'}},
  ]}
function expectTextFor(r){return r<=1?'אליפות':r<=2?'אליפות או סגנות':r<=3?'אחד משלושת המקומות הראשונים':r<=6?'פלייאוף עליון':r<=9?'אמצע הטבלה בלי מאבקי הישארות':'הישארות בליגה'}
function viewBoard(){const c=me();const O=ownerOf(c);const opts=boardMeetingOptions();
  return `<div class="card hero"><h2 style="font-size:24px;color:var(--gold)">ישיבת תקציב · עונת ${seasonLabel()}</h2><div class="small" style="margin-top:6px">הבעלים: <b>${O.he}</b>. ${esc(O.desc)}</div>
  <dl class="kv" style="margin-top:10px"><dt>תקציב נוכחי</dt><dd class="num">${NIS(c.money)}</dd><dt>שכר שבועי</dt><dd class="num">${NIS(c.players.reduce((t,p)=>t+p.wage,0))}</dd><dt>יעד ההנהלה</dt><dd>${esc(G.board.expectText)}</dd><dt>אמון</dt><dd class="num">${G.board.conf}/100</dd><dt>סף פיטורים</dt><dd class="num">אמון מתחת ל-${O.fire}</dd></dl>
  <div class="small muted" style="margin-top:8px">מה אתה מבקש מההנהלה לעונה הקרובה? בחירה אחת.</div></div>

const TAC={press:{high:'פרסינג גבוה',mid:'לחץ בינוני',low:'בלוק נמוך'},width:{wide:'משחק רחב',normal:'רוחב רגיל',narrow:'צפוף במרכז'},tempo:{fast:'קצב גבוה',normal:'קצב רגיל',slow:'קצב איטי'},style:{possession:'החזקת כדור',balanced:'מאוזן',direct:'ישיר',counter:'התקפות מתפרצות'}};

const ROLE_DEF={GK:'stop',DF:'stopper',MF:'b2b',FW:'poach'};

  const t=c.tier===1?{press:'high',width:'wide',tempo:'fast',style:'possession'}:c.tier===2?{press:'mid',width:'normal',tempo:'normal',style:pick(['balanced','direct','possession'])}:{press:'low',width:'narrow',tempo:'slow',style:pick(['counter','direct','balanced'])};
  if(h%5===0)t.style='counter';if(h%7===0)t.press='mid';c.tac=t;return t}
function tacOf(c){return c.tac||defaultTac(c)}
function tacOfM(M,c){return (M&&M.tacOv&&M.tacOv[c.id])||tacOf(c)}
function avgAttr(M,c,pos,idx){const xs=xiPlayers(M,c).filter(x=>!pos||x.p.pos===pos);if(!xs.length)return 60;return xs.reduce((t,x)=>t+attrs(x.p)[idx],0)/xs.length}
function avgFit(M,c){const xs=xiPlayers(M,c);if(!xs.length)return 100;return xs.reduce((t,x)=>t+(x.p.fit??100),0)/xs.length}
/* returns {dh,da,poss,fatH,fatA,notes} = deltas to home/away expected goals per 90, possession shift, fatigue multipliers */
function tacticAdj(M,h,a){
  const th=tacOfM(M,h),ta=tacOfM(M,a);let dh=0,da=0,poss=0,fatH=1,fatA=1;const notes=[];
  const side=(c,o,t,to,isHome)=>{let own=0,opp=0,ps=0,fat=1;
    const mfPass=avgAttr(M,c,'MF',2),fwPace=avgAttr(M,c,'FW',0),fwPhys=avgAttr(M,c,'FW',5),dfDef=avgAttr(M,c,'DF',4),fit=avgFit(M,c);
    if(t.press==='high'){own+=.08;opp+=.03;fat*=1.3;if(to.style==='possession')own+=.06;if(to.style==='direct')own-=.03;if(fit<70){own-=.1;opp+=.06;if(isHome===(c.id===G.me))notes.push('הפרסינג נשבר: השחקנים עייפים מדי')}}

    if(t.width==='wide'){if(fwPace>=68)own+=.06;else own+=.01;opp+=.03}
    if(t.width==='narrow'){opp-=.04;own-=.03}
    if(t.tempo==='fast'){own+=.05;opp+=.04;fat*=1.15}
    if(t.tempo==='slow'){own-=.04;opp-=.04;ps+=.03;fat*=.9}
    if(t.style==='possession'){ps+=.08;if(mfPass>=68)own+=.05;else{own-=.04;opp+=.03}if(to.style==='counter')opp-=.04}
    if(t.style==='direct'){ps-=.06;if(fwPhys>=68)own+=.06;else own+=.01}
    if(t.style==='counter'){ps-=.05;if(to.mentality==='att'||to.press==='high')own+=.09;else own+=.01;if(fwPace>=68)own+=.03}
    if(dfDef>=70&&t.press==='low')opp-=.02;

    for(const {p} of xiPlayers(M,c)){const r=roleOf(p);const f=roleFit(p)*.02+(p.roleM&&p.roleM===r?.015:0);if(r==='play')own+=.03+f;else if(r==='anchor')opp-=.03+f;else if(r==='target'){own+=(t.style==='direct'?.04:.01)+f}else if(r==='false9')own+=.02+f;else if(r==='winger'){own+=(t.width==='wide'?.03:.01)+f}else if(r==='wingback'){own+=.015+f;opp+=.01}else if(r==='ball'){ps+=.01;own+=f}else if(r==='sweep'){if(t.press==='high')opp-=.03;own+=f}else if(r==='poach')own+=f*.5;else own+=f*.5}

}
function liveEnergy(M,c,p,e){const t=tacOf(c);const rate=(t&&t.press==='high'?1.25:t&&t.press==='low'?.85:1)*(t&&t.tempo==='fast'?1.1:1);const played=Math.max(0,M.m-(e?e.since:0));return Math.round(clamp((p.fit??100)-played*.16*rate-Math.max(0,played-60)*.35*rate,15,100))}

/* ---- NATIONAL TEAM ---- */
const NT_GROUP=[{n:'איטליה',s:83},{n:'נורווגיה',s:78},{n:'ישראל',s:0},{n:'אסטוניה',s:57},{n:'מולדובה',s:52}];
function ntStrength(){const all=[...G.clubs,...G.leumit].flatMap(c=>c.players).filter(p=>!p.foreign&&p.nat!=='זר').sort(byOvr).slice(0,16);const avg=all.length?all.reduce((t,p)=>t+p.ovr,0)/all.length:64;return Math.round(avg+3)}
function ntSquad(){return [...G.clubs,...G.leumit].flatMap(c=>c.players.map(p=>({p,c}))).filter(x=>!x.p.foreign&&x.p.nat!=='זר'&&!x.p.inj).sort((a,b)=>b.p.ovr-a.p.ovr).slice(0,23)}
function ensureNT(){if(G.nt&&G.nt.season===G.season)return;const teams=NT_GROUP.map(t=>t.n);const rr=roundRobin(teams);const fixtures=[...rr,...rr.map(r=>r.map(([h,a])=>[a,h]))];G.nt={season:G.season,table:Object.fromEntries(teams.map(n=>[n,{P:0,W:0,D:0,L:0,GF:0,GA:0,pts:0}])),fixtures,played:0,results:[],scorers:{}}}
function ntBreak(evName){ensureNT();const NT=G.nt;const sq=ntSquad();const myCalled=sq.filter(x=>x.c.id===G.me);
  if(myCalled.length)news(`זומנו לנבחרת ישראל: ${myCalled.map(x=>fullName(x.p)).join(', ')}.`);
  for(const {p} of sq){p.caps=(p.caps||0)+2;p.morale=clamp((p.morale??65)+2,10,100)}
  const isr=ntStrength();const sOf=n=>n==='ישראל'?isr:NT_GROUP.find(t=>t.n===n).s;
  for(let k=0;k<2&&NT.played<NT.fixtures.length;k++){const round=NT.fixtures[NT.played++];
    for(const [h,a] of round){const sh=sOf(h),sa=sOf(a);const lh=Math.max(.2,1.3+(sh-sa)*.06+.2),la=Math.max(.2,1.3-(sh-sa)*.06);let gh=0,ga=0;for(let m=0;m<90;m++){if(Math.random()<lh/90)gh++;if(Math.random()<la/90)ga++}
      const upd=(n,f,ag)=>{const t=NT.table[n];t.P++;t.GF+=f;t.GA+=ag;if(f>ag){t.W++;t.pts+=3}else if(f===ag){t.D++;t.pts++}else t.L++};upd(h,gh,ga);upd(a,ga,gh);
      const rec={h,a,gh,ga,scorers:[]};
      if(h==='ישראל'||a==='ישראל'){const g=h==='ישראל'?gh:ga;for(let i=0;i<g;i++){const sc=pick(sq.filter(x=>x.p.pos!=='GK'));if(sc){sc.p.intGoals=(sc.p.intGoals||0)+1;NT.scorers[fullName(sc.p)]=(NT.scorers[fullName(sc.p)]||0)+1;rec.scorers.push(fullName(sc.p));if(sc.c.id===G.me){sc.p.morale=clamp(sc.p.morale+4,10,100);news(`${fullName(sc.p)} כבש לנבחרת ישראל מול ${h==='ישראל'?a:h}!`)}}}
        const opp=h==='ישראל'?a:h;const won=(h==='ישראל'?gh>ga:ga>gh);const draw=gh===ga;
        news(`נבחרת ישראל: ${h} ${gh}:${ga} ${a} (מוקדמות יורו).`);
        if(won||rec.scorers.some(n=>myCalled.some(x=>fullName(x.p)===n)))paper('נבחרת',won?`ישראל ניצחה את ${opp} ${h==='ישראל'?gh+':'+ga:ga+':'+gh}`:`ערב של ${rec.scorers[0]} במדי הנבחרת`,`${rec.scorers.length?'כובשים: '+rec.scorers.join(', '):'משחק ללא שערים ישראליים'}`,`${won?'ניצחון חשוב במוקדמות יורו. ':draw?'תיקו במוקדמות. ':'הפסד במוקדמות. '}${myCalled.length?`מ${me().short} שיחקו: ${myCalled.map(x=>fullName(x.p)).join(', ')}.`:''}`)}
      NT.results.push(rec)}}
}

  return `<div class="card"><div class="row between"><h3 class="sec">נבחרת ישראל · מוקדמות יורו</h3><span class="tag info">כוח ${ntStrength()}</span></div><div class="scroll"><table class="tbl" style="margin-top:8px"><tr><th class="c">#</th><th>נבחרת</th><th class="c">מש</th><th class="c">נצ</th><th class="c">תי</th><th class="c">הפ</th><th class="c">שערים</th><th class="c">נק</th></tr>${st.map(([n,t],i)=>`<tr class="${n==='ישראל'?'me':''} ${i<2?'top6':''}"><td class="c num">${i+1}</td><td>${esc(n)}</td><td class="c num">${t.P}</td><td class="c num">${t.W}</td><td class="c num">${t.D}</td><td class="c num">${t.L}</td><td class="c num">${t.GF}:${t.GA}</td><td class="c num"><b>${t.pts}</b></td></tr>`).join('')}</table></div><div class="muted tiny" style="margin-top:6px">שתי הראשונות עולות ליורו. המשחקים נערכים בפגרות הנבחרת (4 בעונה, 2 משחקים בכל פגרה).</div></div>

function requestLoan(nid){const n=negById(nid);if(!n||n.stage!=='club')return;const f=sellerClub(n.pid);if(!f)return;const {p,c:sc}=f;const c=me();
  const fee=Math.max(100000,Math.round(marketValue(p)*.15/5e4)*5e4);if(c.money<fee){n.log.push(`דמי השאלה: ${NIS(fee)}. אין מספיק תקציב.`);return}
  n.rounds++;const ok=!n.key&&Math.random()<.8||(n.key&&Math.random()<.2);
  if(ok){n.loan={fee,buy:Math.round(marketValue(p)*1.1/1e5)*1e5};n.offer={fee,inst:1,sellon:0};n.stage='player';n.pdemand=playerDemand(p,c,sc);n.pdemand.years=1;n.poffer={wage:n.pdemand.wage,years:1,role:n.pdemand.role,bonus:0};n.ppatience=2;n.log.push(`${sc.short} מסכימה להשאיל אותו לעונה תמורת ${NIS(fee)}, עם אופציית רכישה של ${NIS(n.loan.buy)}. עכשיו צריך לשכנע את השחקן.`)}
  else{n.patience--;n.log.push(`${sc.short}: "${pick(['הוא לא יוצא בהשאלה.','אנחנו צריכים אותו העונה.','רק מכירה.'])}"`);if(n.patience<=0){n.stage='dead';n.log.push(`${sc.short} סגרה את הדלת.`)}}
  save()}
function exerciseBuy(pid){const c=me();const p=c.players.find(x=>x.id===pid);if(!p||!p.loan)return;if(!WINDOW(G.wk))return toast('אפשר להפעיל אופציה רק בחלון פתוח');if(c.money<p.loan.buy)return toast('אין מספיק תקציב');
  c.money-=p.loan.buy;addLog(`הפעלת אופציית רכישה: ${fullName(p)}`,-p.loan.buy);news(`${fullName(p)} נרכש סופית מ${p.loan.fromName} תמורת ${NIS(p.loan.buy)}.`);const fromN=p.loan.fromName,buyFee=p.loan.buy;p.loan=null;p.contract=3;p.morale=clamp(p.morale+6,10,100);closeModal();save();recordSigning(p,c,'perm',{from:fromN,fee:buyFee});render()}
function returnLoans(){const c=me();for(const p of c.players.slice()){if(!p.loan)continue;const from=club(p.loan.from);c.players=c.players.filter(x=>x!==p);if(from){p.kn=2;p.lg=from.lg;if(from.lg){p.vmult=WORLD_LEAGUES[from.lg].vmult;p.wmult=WORLD_LEAGUES[from.lg].wmult}p.loan=null;p.contract=2;from.players.push(p)}news(`${fullName(p)} חזר מההשאלה ל${p.loan?p.loan.fromName:from?from.short:'המועדון שלו'}.`)}}

function takeBankLoan(amount){const c=me();const max=Math.round(clamp(c.squadValue*.3,5e6,40e6));if(G.bank&&G.bank.left>0)return toast('יש כבר הלוואה פעילה');if(amount>max)return toast(`הבנק מאשר עד ${NIS(max)}`);
  const total=Math.round(amount*1.16);const weeks=92;G.bank={principal:amount,total,weekly:Math.round(total/weeks),left:weeks};c.money+=amount;addLog('הלוואה בנקאית',amount);G.board.conf=clamp(G.board.conf-Math.round(amount/5e6),0,100);news(`נלקחה הלוואה של ${NIS(amount)} (ריבית 8% לעונה, החזר על פני שתי עונות).`);paper('כספים',`${c.name} לקחה הלוואה של ${NIS(amount)}`,'ההחזר: '+NIS(G.bank.weekly)+' לשבוע במשך שתי עונות',`בהנהלה מסבירים שהכסף מיועד לחיזוק הסגל. ${pick(['בקרת התקציבים תעקוב.','האוהדים חוששים ממינוף יתר.','הבעלים חתם ערבות אישית.'])}`);save();render()}
function bankWeekly(){if(!G.bank||G.bank.left<=0)return;const c=me();c.money-=G.bank.weekly;G.bank.left--;addLog('החזר הלוואה',-G.bank.weekly);if(G.bank.left<=0){news('ההלוואה הבנקאית נפרעה במלואה.');G.bank=null}}
function budgetControl(){const c=me();if(c.money<-3e6){c.ptsPen=3;paper('ליגה',`בקרת התקציבים: ${c.name} תפתח את העונה עם 3- נקודות`,`גירעון של ${NIS(-c.money)} בסיום העונה`,`הרשות לבקרת תקציבים החליטה על הפחתת נקודות. ${pick(['במועדון שוקלים ערעור.','הבעלים הבטיח להזרים כסף.','האוהדים זועמים על ההנהלה.'])}`);news('בקרת התקציבים: 3- נקודות בעונה הבאה בגלל הגירעון.');G.board.conf=clamp(G.board.conf-8,0,100)}}
function namingOffer(c){return Math.round(c.cap*(c.ticket||70)*.9/1e5)*1e5}
function sellNaming(){const c=me();if(c.naming)return toast('יש כבר חוזה שם לאצטדיון');const sp=pick(SPONSORS.filter(s=>!c.sponsor||s!==c.sponsor.name));const amt=namingOffer(c);c.naming={name:sp,annual:amt,years:3,orig:c.stadium};c.stadium=`אצטדיון ${sp}`;c.fans=clamp(c.fans-3,10,100);news(`האצטדיון ייקרא "אצטדיון ${sp}" בשלוש העונות הבאות, ${NIS(amt)} לעונה.`);paper('כספים',`${c.orig||c.naming.orig} הופך ל"אצטדיון ${sp}"`,`זכויות השם נמכרו ב-${NIS(amt)} לעונה`,`האוהדים הוותיקים לא אוהבים את השינוי, אבל הכסף ייכנס לקופה כל שבוע. ${pick(['"נמשיך לקרוא לו בשם הישן", אומרים ביציע.','ההנהלה: "ככה עושים בכל אירופה".'])}`);save();render()}
function namingWeekly(){const c=me();if(!c.naming)return;const w=Math.round(c.naming.annual/46);c.money+=w;addLog('זכויות שם האצטדיון',w)}
