name: Fetch Commons portraits
# Manual: finds freely licensed Wikimedia Commons portraits for real European squads and commits the raw candidates
# (images + manifest with licence/author/credit) to the `portrait-sources` branch. Nothing is shipped from here:
# scripts/import-commons-portraits.py and scripts/build-portraits.py select and process them on main.
on:
  workflow_dispatch:
    inputs:
      clubs:
        description: 'comma-separated data/euro keys, or "all"'
        required: true
        default: 'real_madrid,barcelona,atletico'
      width:
        description: 'rendition width in px (640 default; larger for faces that were too small)'
        required: false
        default: '640'
      players:
        description: 'optional: only these English names, separated by |'
        required: false
        default: ''
      deep:
        description: 'also search sub-categories and Commons full text (for players still on the fallback)'
        required: false
        default: 'false'
permissions:
  contents: write
concurrency:
  group: portrait-sources
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check out portrait-sources
        run: |
          git fetch origin portrait-sources || true
          if git rev-parse --verify origin/portrait-sources >/dev/null 2>&1; then
            git worktree add /tmp/wt origin/portrait-sources && git -C /tmp/wt checkout -B portrait-sources
          else
            git worktree add --detach /tmp/wt && git -C /tmp/wt checkout --orphan portrait-sources && git -C /tmp/wt rm -rf . >/dev/null || true
          fi
      - name: Fetch candidates
        run: python3 scripts/fetch-commons-portraits.py --clubs "${{ github.event.inputs.clubs }}" --width "${{ github.event.inputs.width }}" --players "${{ github.event.inputs.players }}" --max-candidates "${{ github.event.inputs.deep == 'true' && 14 || (github.event.inputs.players != '' && 8 || 5) }}" --cat-limit "${{ github.event.inputs.players != '' && 30 || 8 }}" --out /tmp/wt/euro ${{ github.event.inputs.deep == 'true' && '--deep' || '' }}
      - name: Commit to portrait-sources
        run: |
          cd /tmp/wt
          git config user.name "GOALASSO portraits bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A euro
          git commit -m "Commons portrait candidates: ${{ github.event.inputs.clubs }} (w${{ github.event.inputs.width }})" || echo "nothing new"
          git push origin portrait-sources
