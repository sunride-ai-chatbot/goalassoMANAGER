name: IFA probe (temporary)
# One plain request to the federation's public club page: does it answer a plain client at all, and is the squad in the HTML?
# Temporary branch only; nothing is stored.
on:
  push:
    branches: [ifa-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask for one club page and the league page
        run: |
          UA="GOALASSO-squad-check/1.0 (football management game; reads squad names and ages only)"
          for u in "https://www.football.org.il/team-details/?itemid=%7B2AE09DED-5019-4C49-BFD5-4458C66F9D24%7D&team_id=6837&season_id=28" \
                   "https://www.football.org.il/leagues/league/?league_id=45&season_id=28" \
                   "https://www.football.org.il/robots.txt"; do
            echo "=== $u"
            code=$(curl -sS -L --max-time 40 -A "$UA" -H "Accept-Language: he" -o page.html -D head.txt -w "%{http_code}" "$u" || echo "curl-failed")
            echo "status $code, bytes $(wc -c < page.html 2>/dev/null)"
            grep -i -E "^(server|content-type|x-|cf-)" head.txt | cut -c1-120 | head -12
            echo "birth-date labels: $(grep -o 'תאריך לידה' page.html | wc -l) · team links: $(grep -o 'team_id=[0-9]*' page.html | sort -u | wc -l) · asmx: $(grep -o '[A-Za-z_/.]*\.asmx/[A-Za-z_]*' page.html | sort -u | tr '\n' ' ')"
            grep -o '<title>[^<]*' page.html | head -2
            python3 - <<'PY'
          import re
          s = open('page.html', encoding='utf8', errors='replace').read()
          if s.lstrip().lower().startswith('user-agent') or 'disallow' in s[:400].lower():
              print(s[:1500])
          i = s.find('תאריך לידה')
          if i > 0:
              print('--- markup around the first player'); print(re.sub(r'\s+', ' ', s[max(0, i - 1500): i + 700]))
          else:
              print('--- start of body'); print(re.sub(r'\s+', ' ', re.sub(r'<script.*?</script>|<style.*?</style>', '', s, flags=re.S))[:1200])
          PY
            sleep 3
          done
