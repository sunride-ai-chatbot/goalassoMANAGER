name: Build and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - run: npm test
      - name: Check out the approved Penalty Hero release
        uses: actions/checkout@v4
        with:
          repository: sunride-ai-chatbot/penalty-hero
          ref: b49e6f3e7e65fce82cef2cfb81d0b6898c7938b1
          path: _penalty-hero
          persist-credentials: false
      - name: Test and build standalone Penalty Hero
        working-directory: _penalty-hero
        run: |
          npm test
          npm run build
      - run: |
          mkdir -p _site
          cp ligat-haal-manager.html _site/index.html
          cp beginner.html _site/beginner.html
          cp version.json _site/version.json
          find assets -maxdepth 1 -type f -exec cp {} _site/ \;
          cp -R assets _site/assets
      - name: Install standalone Penalty Hero at its existing URL
        run: node scripts/stage-penalty-hero.mjs _penalty-hero/dist _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
